<script>
/* ============================================================
   PRODUCTION FLOOR — simulated queue engine + operator view
   States: printer sleeping → idle → printing → error
   Orders: queued → printing → qc_required → ready_to_ship → shipped
           (failures → attention / reprint, with recovery)
   ============================================================ */
const PROD = {
  timer: null,
  start(){ if (this.timer) return; this.timer = setInterval(() => this.tick(), 400); },
  stop(){ clearInterval(this.timer); this.timer = null; },
  printer(){ return DB.printer; },
  current(){ return DB.printer.jobId ? DB.orders.find(o => o.id === DB.printer.jobId && o.status === 'printing') : null; },
  queue(){ return DB.orders
    .filter(o => o.status === 'queued' || o.status === 'reprint')
    .sort((a,b) => (a.status === 'reprint' ? 0 : 1) - (b.status === 'reprint' ? 0 : 1) || a.createdAt - b.createdAt); },
  tryAuto(){
    if (DB.printer.status === 'idle' && this.queue().length && !DB.printer.autoAt){
      DB.printer.autoAt = Date.now() + 1500; save();
    }
  },
  tick(){
    const cur = this.current();
    if (cur){
      const el = Date.now() - DB.printer.startAt;
      const p = Math.min(100, el / DB.printer.dur * 100);
      const bar = $('#job-pbar i'); if (bar) bar.style.width = p.toFixed(1) + '%';
      const lab = $('#job-pct'); if (lab) lab.textContent = Math.floor(p) + '%';
      const eta = $('#job-eta'); if (eta) eta.textContent = Math.max(0, Math.ceil((DB.printer.dur - el) / 1000)) + 's remaining';
      if (p >= 100) this.complete(cur);
    } else if (DB.printer.status === 'idle' && DB.printer.autoAt && Date.now() >= DB.printer.autoAt){
      const q = this.queue();
      if (q.length) this.startJob(q[0]); else { DB.printer.autoAt = 0; }
    }
  },
  startJob(o){
    o.status = 'printing';
    pushT(o, 'printing', o.timeline.some(t => t.k === 'issue') ? 'Reprint in progress after earlier failure.' : '');
    DB.printer = { status:'printing', jobId:o.id, startAt:Date.now(), dur:DB.settings.pace, autoAt:0 };
    save(); refreshProd();
  },
  complete(o){
    o.status = 'qc_required';
    pushT(o, 'printed');
    DB.printer = { status:'idle', jobId:null, startAt:0, dur:DB.settings.pace, autoAt:0 };
    save(); refreshProd(); this.tryAuto();
    notifyCust(o, 'Printed — now waiting for quality check.');
  },
  simulateError(){
    const cur = this.current(); if (!cur) return;
    const reasons = [
      'Printer unavailable — media path jam (simulated)',
      'Material problem — transfer film splice detected',
      'Artwork issue — RIP raster engine rejected the job',
      'Operator intervention required — temperature excursion',
    ];
    const reason = reasons[rnd(reasons.length)];
    cur.status = 'attention'; cur.errorReason = reason;
    pushT(cur, 'issue', reason);
    DB.printer = { status:'error', jobId:null, startAt:0, dur:DB.settings.pace, autoAt:0 };
    save(); refreshProd();
    toast('Print error (simulated)', cur.num + ' moved to ATTENTION REQUIRED — no silent failures.', 'err');
  },
  retry(o){
    o.status = 'printing';
    pushT(o, 'printing', 'Retry after print error.');
    DB.printer = { status:'printing', jobId:o.id, startAt:Date.now(), dur:DB.settings.pace, autoAt:0 };
    save(); refreshProd();
  },
  morningQC(o){
    o.status = 'qc_required';
    pushT(o, 'printed', 'Marked for morning QC after overnight issue.');
    DB.printer = { status:'idle', jobId:null, startAt:0, dur:DB.settings.pace, autoAt:0 };
    save(); refreshProd(); this.tryAuto();
  },
  cancel(o){
    o.status = 'cancelled';
    DB.printer = { status:'idle', jobId:null, startAt:0, dur:DB.settings.pace, autoAt:0 };
    save(); refreshProd();
  },
  qcPass(o){
    o.status = 'ready_to_ship';
    pushT(o, 'qc_pass');
    save(); refreshProd();
    notifyCust(o, 'Passed quality check — getting ready to ship.');
  },
  qcFail(o){
    o.status = 'reprint';
    pushT(o, 'issue', 'QC failed — reprint required.');
    save(); refreshProd(); this.tryAuto();
    notifyCust(o, 'Quality check failed — we are reprinting your sheet at no charge.');
  },
  ship(o){
    o.status = 'shipped';
    o.shippedAt = Date.now();
    o.tracking = 'EVT-' + String(100000000 + rnd(899999999));
    pushT(o, 'shipped');
    save(); refreshProd();
    notifyCust(o, 'Shipped! Tracking ' + o.tracking + ' (simulated carrier).');
  },
  wake(){
    if (this.current()){ toast('Printer busy', 'A job is printing — let it finish or simulate an error first.', 'warn'); return; }
    if (DB.printer.status === 'printing') return;
    DB.printer.status = 'idle';
    save(); refreshProd();
    toast('Printer awake', 'Idle and ready — queued jobs start automatically.', 'ok');
    this.tryAuto();
  },
  sleep(){
    if (this.current() || DB.printer.status === 'printing'){ toast('Printer busy', 'Finish the current print (or simulate an error) before sleeping.', 'warn'); return; }
    DB.printer.status = 'sleeping'; DB.printer.autoAt = 0;
    save(); refreshProd();
    toast('Printer asleep', 'New orders still enter the queue — they print when the press wakes.', 'info');
  },
};
function notifyCust(o, msg){
  if (currentBiz() && currentBiz().id === o.businessId){
    toast('Order ' + o.num, msg, 'info');
  }
}
function refreshProd(){
  if (['production','orders','dashboard','confirm'].includes(APP.view)) render();
}

/* ---------------- production view ---------------- */

      <div class="qc-actions">

        ${pr.status === 'idle' ? `<button class="btn sm pri" data-act="prod-print-now" data-id="${o.id}">Print now</button>` : ''}
        <button class="btn sm ghost" data-act="ord-view" data-id="${o.id}" data-prod="1">View</button>

  const stationCard = (o, kind) => {

        <div class="qc-meta">ORDER ${fmtDT(o.createdAt)} · PRINTED ${o.timeline.find(t=>t.k==='printed') ? relTime(o.timeline.find(t=>t.k==='printed').at).toUpperCase() : ''}<br>
          SHEET 13 × 13 IN · AREA 12.5 × 12.5 IN · ${o.sheets.reduce((s,x)=>s+x.items.length,0)} ITEMS</div>
        <div class="qc-actions">
          <button class="btn sm ok" data-act="qc-pass" data-id="${o.id}" data-test="qc-pass">${ic('check',12)} PASS QC</button>
          <button class="btn sm dgr" data-act="qc-fail" data-id="${o.id}" data-test="qc-fail">${ic('x',12)} FAIL QC</button>
          <button class="btn sm ghost" data-act="ord-view" data-id="${o.id}" data-prod="1">Details</button>
        </div>
      </div>`;
    }
    if (kind === 'ship'){
      const a = o.address || {};
      return `<div class="q-card">
        <div class="qc-head"><b>${o.num}</b><span class="chip st-ready"><span class="dot"></span>READY TO SHIP</span>
          <span class="qc-biz">${esc(o.businessName)}</span></div>
        <div class="addr-block"><b>${esc(a.name || o.businessName)}</b><br>${esc(a.street || '')}<br>${esc([a.city, a.state, a.zip].filter(Boolean).join(', '))}</div>
        <div class="qc-contents">${o.sheets.map(s => esc(s.label) + ' — ' + s.contents.join(', ')).join(' · ')}</div>
        <div class="qc-actions">
          <button class="btn sm pri" data-act="ship-mark" data-id="${o.id}" data-test="ship-mark">${ic('truck',12)} MARK SHIPPED</button>
          <button class="btn sm ghost" data-act="ord-view" data-id="${o.id}" data-prod="1">Details</button>
        </div>
      </div>`;
    }
    // attention / problems
    return `<div class="q-card" style="border-color:rgba(239,83,80,.45)">
      <div class="qc-head"><b>${o.num}</b><span class="chip st-attention pulse"><span class="dot"></span>ATTENTION REQUIRED</span>
        <span class="qc-biz">${esc(o.businessName)}</span></div>
      <div class="sim-note" style="border-color:rgba(239,83,80,.4);color:var(--red2);margin:10px 0">${ic('alert',12)} ${esc(o.errorReason || 'Print error — cause unknown (simulated).')}</div>
      <div class="qc-contents">${o.sheets.map(s => esc(s.contents.join(', '))).join(' · ')}</div>
      <div class="qc-actions">
        <button class="btn sm pri" data-act="prod-retry" data-id="${o.id}">${ic('refresh',12)} RETRY PRINT</button>
        <button class="btn sm" data-act="prod-morning" data-id="${o.id}">${ic('moon',12)} MARK FOR MORNING QC</button>
        <button class="btn sm dgr" data-act="prod-cancel" data-id="${o.id}">${ic('x',12)} CANCEL</button>
      </div>
    </div>`;
  };

  return `
  <div class="page-head">
    <div><h1>${ic('factory',20)} Production floor</h1>
      <div class="ph-sub">Simulated operations · orders flow here the moment payment clears</div></div>
    <div class="spacer"></div>
    <div class="pace-seg" data-tip="Demo print duration">
      <button class="${DB.settings.pace <= 7000 ? 'on' : ''}" data-act="prod-pace" data-p="6000">Fast</button>

  <div class="prod-stats">
    <div class="pstat sq"><b class="tnum">${q.length}</b><span>Queue</span></div>
    <div class="pstat sp"><b class="tnum">${cur ? 1 : 0}</b><span>Printing</span></div>
    <div class="pstat sqc"><b class="tnum">${qcList.length}</b><span>QC required</span></div>
    <div class="pstat sr"><b class="tnum">${shipList.length}</b><span>Shipping</span></div>
    <div class="pstat sa"><b class="tnum">${probs.length}</b><span>Problems</span></div>

            ${pr.status === 'idle' ? `<button class="btn sm" data-act="prod-sleep" data-test="prod-sleep">${ic('moon',13)} SLEEP PRINTER</button>` : ''}
            ${pr.status === 'error' ? `<button class="btn sm pri" data-act="prod-wake">${ic('power',13)} RESET TO IDLE</button>` : ''}
          </div>
          ${cur ? `
          <div class="job-card">
            <div class="jc-head"><b>${cur.num}</b>
              <span class="qc-biz">${esc(cur.businessName)}</span>
              <span class="chip st-printing pulse" style="margin-left:auto"><span class="dot"></span>PRINTING</span></div>
            <div class="pbar" id="job-pbar"><i style="width:${pct}%"></i></div>
            <div class="pmeta"><span id="job-pct">${Math.floor(pct)}%</span><span id="job-eta">${Math.max(0, Math.ceil((pr.dur - elapsed)/1000))}s remaining</span></div>

          </div>` : ''}
          ${pr.status === 'idle' && !q.length ? `<div class="sim-note">${ic('check',12)} Press is idle and the queue is clear. New paid orders auto-start the moment they arrive.</div>` : ''}
          ${pr.status === 'sleeping' ? `<div class="sim-note">${ic('moon',12)} Overnight mode. A customer can still order at 2:17 AM — the job queues itself and prints when the press wakes. No human needs to move it.</div>` : ''}
          ${pr.status === 'idle' && q.length && pr.autoAt ? `<div class="sim-note">${ic('clock',12)} Auto-start engaged — next job begins in ~1s. Orders never wait for an operator.</div>` : ''}

<script>
/* ============================================================
   BOOT LAYER — toasts, modals, action dispatch, forms, start
   (wires the whole app together; everything above is pure)
   ============================================================ */

/* ---------------- toasts ---------------- */
function toast(title, msg, kind='info', ttl=3400){
  const root = $('#toast-root'); if (!root) return;
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  const icn = { ok:'check', err:'alert', warn:'alert', info:'clock' }[kind] || 'clock';
  el.innerHTML = `${ic(icn,16)}<div style="flex:1;min-width:0"><b>${esc(title)}</b><span>${esc(msg)}</span></div>`;
  root.appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 260); }, ttl);
}

/* ---------------- modal ---------------- */
let MODAL_STATIC = false;
function openModal(inner, opts={}){
  const root = $('#modal-root'); if (!root) return;
  MODAL_STATIC = !!opts.static;
  root.innerHTML = `<div class="modal-bg"><div class="modal ${opts.size || ''}">${inner}</div></div>`;
  const bg = root.firstElementChild;
  bg.addEventListener('pointerdown', e => { if (e.target === bg && !MODAL_STATIC) closeModal(); });
  bg.addEventListener('click', e => { if (e.target === bg && !MODAL_STATIC) closeModal(); });
}
function closeModal(){ const r = $('#modal-root'); if (r) r.innerHTML = ''; MODAL_STATIC = false; }
function confirmModal(title, msg, onYes, opts={}){
  openModal(`
    <div class="m-head"><h3>${ic('alert',15)} ${esc(title)}</h3>
      <button class="m-x" data-act="modal-close">${ic('x',15)}</button></div>
    <div class="m-body"><p style="margin:0;line-height:1.65;color:var(--mut);font-size:13.5px">${msg}</p></div>
    <div class="m-foot">
      <button class="btn left" data-act="modal-close">Cancel</button>
      <button class="btn ${opts.danger ? 'dgr' : 'pri'}" id="confirm-yes">${esc(opts.yes || 'Confirm')}</button>
    </div>`);
  const btn = $('#confirm-yes');
  if (btn) btn.addEventListener('click', () => { closeModal(); onYes(); });
}

/* ---------------- view / mount registries ---------------- */
const VIEW = {
  landing: VIEW_landing, auth: VIEW_auth, dashboard: VIEW_dashboard,
  branding: VIEW_branding, templates: VIEW_templates, employees: VIEW_employees,
  artwork: VIEW_artwork, account: VIEW_account, editor: VIEW_editor,
  cart: VIEW_cart, checkout: VIEW_checkout, confirm: VIEW_confirm,
  orders: VIEW_orders, production: VIEW_production,
};
const MOUNT = {
  branding: MOUNT_branding, employees: MOUNT_employees, artwork: MOUNT_artwork,
  editor: MOUNT_editor, checkout: MOUNT_checkout,
};

/* ---------------- session helpers ---------------- */
function loginAs(bizId){
  const b = DB.businesses[bizId]; if (!b) return;
  DB.session = { businessId: bizId };
  ED_reset();
  save();
  go('dashboard');
  toast('Welcome, ' + b.name, 'Demo session loaded — your branding, people and templates are ready.', 'ok');
}
function empById(id){ return DB.employees.find(x => x.id === id); }
function artById(id){ return DB.artwork.find(x => x.id === id); }
const CAT_FOR_TYPE = {
  badge:'NAME BADGES', apron:'APRONS', chest:'SHIRTS', back:'SHIRTS', hat:'HATS',
  bag:'REUSABLE BAGS', staff:'STAFF / EVENT', text:'CUSTOM DESIGNS', shape:'CUSTOM DESIGNS',
  logo:'CUSTOM DESIGNS', image:'CUSTOM DESIGNS',
};

/* ---------------- editor add-helpers ---------------- */
function handleAdd(key){
  const q = QUICK_ADD.find(x => x.key === key); if (!q) return;
  if (q.special === 'upload'){
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*';
    inp.addEventListener('change', () => {
      if (!inp.files || !inp.files.length) return;
      processUpload(inp.files[0], art => {
        DB.artwork.push({ id: uid(), businessId: currentBiz().id, name: art.name.replace(/\.[^.]+$/, ''),
          kind:'upload', src: art.src, w: art.w, h: art.h });
        ED_addItem(mkItem('image', { data: { src: art.src, natW: art.w, natH: art.h } }));
        save();
        toast('Artwork added', 'Placed on the sheet — drag to position, resize from the corner.', 'ok');
      }, 900);
    });
    inp.click();
    return;
  }
  if (key === 'text'){ ED_addItem(mkItem('text')); return; }
  if (key === 'shape'){ ED_addItem(mkItem('shape')); return; }
  if (key === 'logo'){ ED_addItem(mkItem('logo')); return; }
  ED_addItem(mkItem(q.tpl));
}
function openSaveTemplateModal(it){

    <div class="m-head"><h3>${ic('layers',15)} Save as reusable template</h3>
      <button class="m-x" data-act="modal-close">${ic('x',15)}</button></div>
    <form data-form="save-template" data-id="${it.id}" novalidate>
      <div class="m-body">
        <div class="field"><label class="lbl">Template name</label>
          <input class="inp" name="name" value="${esc(TYPE_NAMES[it.type] + ' — ' + (it.data?.name || 'Custom'))}" maxlength="44" data-test="tpl-name"></div>
        <div class="field"><label class="lbl">Note <span class="dim" style="text-transform:none;letter-spacing:0">(optional)</span></label>
          <input class="inp" name="note" placeholder="Where you use it" maxlength="60"></div>
        <div class="hint-box">Saved templates show up in your library and are picked automatically
        when you build employee packs for <b>${esc(currentBiz().name)}</b>.</div>
      </div>
      <div class="m-foot">
        <button type="button" class="btn left" data-act="modal-close">Cancel</button>
        <button class="btn pri" data-test="tpl-save">${ic('check',13)} Save template</button>
      </div>
    </form>`);
}

/* ---------------- action dispatcher ---------------- */
function closeDropdowns(){
  $$('.menu-dd.open, .dd-menu.open').forEach(el => el.classList.remove('open'));
}
const ACT = {
  /* navigation + session */
  'nav':            t => go(t.dataset.view),
  'go-landing':     () => go('landing'),
  'load-demo':      () => loginAs('joes'),
  'login-demo':     t => loginAs(t.dataset.b),
  'switch-biz':     t => loginAs(t.dataset.b),
  'logout':         () => { DB.session = null; APP.volatileBiz = null; save(); ED_reset(); go('landing');
                      toast('Signed out', 'Session ended — demo data stays in this browser.', 'info'); },
  'auth-tab':       t => go('auth', { tab: t.dataset.tab }),
  'forgot-pw':     () => toast('Prototype only', 'Password reset is simulated — demo accounts accept the password demo123.', 'info'),
  'user-menu':      () => { const dd = $('#user-dd'); if (dd) dd.classList.toggle('open'); },
  'reset-demo':    () => confirmModal('Reset demo data?',
                      'Every business, employee, order and the production queue returns to its original seeded state. Your current session will be signed out.',
                      () => resetDemoData(), { danger:true, yes:'Reset everything' }),

  /* dashboard / demo */
  'new-order':     () => ED_newSession({}),
  'sample-order':  () => { const o = buildSampleOrder(currentBiz().id); render();
                      toast('Sample order created', o.num + ' entered the production queue — watch it in Production mode.', 'ok'); },
  'inject-sample': () => { const others = businessList().filter(x => x.id !== currentBiz()?.id);
                      const biz = others[rnd(others.length)] || businessList()[0];
                      const o = buildSampleOrder(biz.id); render();
                      toast('Sample order injected', o.num + ' for ' + biz.name + ' entered the queue.', 'ok'); },
  'reorder-none':  () => {},

  /* employees */
  'emp-add-modal': () => openModal(empFormHTML(null)),
  'emp-edit-modal':t => { const e = empById(t.dataset.e); if (e) openModal(empFormHTML(e)); },
  'emp-del':       t => { const e = empById(t.dataset.e); if (!e) return;
                      confirmModal('Remove ' + esc(e.name) + '?', 'Their packs and saved templates stay — only the employee record is removed.',
                        () => { DB.employees = DB.employees.filter(x => x.id !== e.id); save(); render();
                        toast('Employee removed', e.name + ' is no longer on the roster.', 'info'); },
                        { danger:true, yes:'Remove employee' }); },
  'emp-pack-modal':t => { const e = empById(t.dataset.e); if (e) openModal(empPackModalHTML(e)); },

  /* templates + artwork + branding */
  'tpl-use':       t => {
                      if (t.dataset.saved){
                        const st = DB.savedTemplates.find(x => x.id === t.dataset.t);
                        if (!st) return;
                        const base = mkItem(st.itemId, { data: deep(st.d) });
                        if (st.w){ base.w = st.w; base.h = st.h; }
                        ED_newSession({ items: [base], label: st.name });
                      } else {
                        const tpl = TPL_BY_ID[t.dataset.t]; if (!tpl) return;
                        ED_newSession({ items: [mkItem(tpl.id)], label: tpl.name });
                      }
                      toast('Template opened', 'One copy placed on a fresh 13″ × 13″ sheet — duplicate it for more.', 'info'); },
  'art-upload':   () => { const inp = $('#art-file'); if (inp) inp.click(); },
  'art-use':       t => { const a = artById(t.dataset.a); if (!a) return;
                      ED_newSession({ items: [mkItem('image', { data: { src: a.src, natW: a.w, natH: a.h } })], label: a.name }); },
  'art-del':       t => { DB.artwork = DB.artwork.filter(x => x.id !== t.dataset.a); save(); render();
                      toast('Artwork deleted', 'Removed from your saved artwork.', 'info', 2000); },
  'logo-upload':  () => { const inp = $('#logo-file'); if (inp) inp.click(); },
  'logo-regen':   () => { const b = currentBiz();
                      b.logo = makeLogo(b.name, b.colors.primary, b.colors.secondary, b.glyph || 'flame');
                      b.uploadedLogo = false; save(); render();
                      toast('Monogram regenerated', 'A fresh logo mark was built from your name and colors.', 'ok'); },

  /* modal + item editing */
  'modal-close':  () => closeModal(),
  'item-del':      t => { ED.items = ED.items.filter(i => i.id !== t.dataset.id); ED_selPrune();
                      closeModal(); ED_commit(); toast('Item deleted', 'Removed from the sheet.', 'info', 1600); },
  'item-dup':      t => { const it = ED.items.find(i => i.id === t.dataset.id); if (!it) return;
                      const c = deep(it); c.id = uid(); c.x = Math.min(it.x + .25, AREA_IN - c.w); c.y = Math.min(it.y + .25, AREA_IN - c.h);
                      ED.items.push(c); closeModal(); ED_commit(); },
  'item-save-template': t => { const it = ED.items.find(i => i.id === t.dataset.id); if (it) openSaveTemplateModal(it); },

  /* preflight / cart */
  'pf-fix':        t => fixPreflight(t.dataset.fix),
  'pf-add-cart':  () => openAddToCartModal(),
  'cart-qty':      t => { const ci = cartFor(currentBiz().id).find(x => x.id === t.dataset.id); if (!ci) return;
                      ci.qty = clamp(ci.qty + (+t.dataset.d), 1, 20); save(); render(); },
  'cart-remove':   t => { DB.carts[currentBiz().id] = cartFor(currentBiz().id).filter(x => x.id !== t.dataset.id);
                      save(); render(); toast('Removed from cart', 'The sheet design is gone from this order.', 'info', 2000); },
  'cart-edit':     t => { const ci = cartFor(currentBiz().id).find(x => x.id === t.dataset.id); if (!ci) return;
                      ED_newSession({ items: deep(ci.items), label: ci.label, cartSheetId: ci.id }); },

  /* orders */
  'ord-view':      t => openOrderModal(t.dataset.id, { production: t.dataset.prod === '1' }),

  /* production */
  'qc-pass':       t => PROD.qcPass(orderByNum(t.dataset.id)),
  'qc-fail':       t => PROD.qcFail(orderByNum(t.dataset.id)),
  'ship-mark':     t => PROD.ship(orderByNum(t.dataset.id)),
  'prod-wake':    () => PROD.wake(),
  'prod-sleep':   () => PROD.sleep(),
  'prod-pace':     t => { DB.settings.pace = +t.dataset.p;
                      if (DB.printer.status !== 'printing') DB.printer.dur = +t.dataset.p;
                      save(); render(); },
  'prod-print-now':t => { const o = orderByNum(t.dataset.id); if (!o) return;
                      if (PROD.current()){ toast('Printer busy', 'A job is already printing — let it finish first.', 'warn'); return; }
                      DB.printer.status = 'idle'; DB.printer.autoAt = 0; PROD.startJob(o); },
  'prod-complete': () => { const cur = PROD.current(); if (cur) PROD.complete(cur); },
  'prod-error':   () => PROD.simulateError(),
  'prod-retry':    t => PROD.retry(orderByNum(t.dataset.id)),
  'prod-morning':  t => PROD.morningQC(orderByNum(t.dataset.id)),
  'prod-cancel':   t => { const o = orderByNum(t.dataset.id); if (!o) return;
                      confirmModal('Cancel ' + o.num + '?', 'The order is cancelled and the customer is notified. Nothing is charged — it was always a demo.',
                        () => { PROD.cancel(o); toast('Order cancelled', o.num + ' is closed — no charge was made (demo).', 'info'); },
                        { danger:true, yes:'Cancel order' }); },

  /* editor toolbar */
  'ed-undo':      () => ED_undo(),
  'ed-redo':      () => ED_redo(),
  'ed-snap':      () => { ED.snap = !ED.snap; const b = $('#tg-snap'); if (b) b.classList.toggle('on', ED.snap); ED_status(); },
  'ed-grid':      () => { ED.grid = !ED.grid; const b = $('#tg-grid'); if (b) b.classList.toggle('on', ED.grid); ED_paint(); },
  'ed-align':     t => ED_align(t.dataset.m),
  'align-dd':     () => { const dd = $('#align-dd'); if (dd) dd.classList.toggle('open'); },
  'ed-add':        t => handleAdd(t.dataset.key),
  'ed-emp-apply': () => { const v = $('#ed-emp')?.value; const emp = v && empById(v);
                      if (!emp){ toast('No employee selected', 'Add employees first — then apply them to selected items.', 'warn'); return; }
                      let n = 0;
                      ED.items.forEach(it => { if (!ED.sel.has(it.id) || !hasName(it)) return;
                        it.data = it.data || {}; it.data.name = emp.name;
                        it.data.sub = emp.position || emp.department || it.data.sub; n++; });
                      if (n){ ED_commit(); toast('Employee applied', emp.name + ' filled ' + n + ' selected item' + (n>1?'s':'') + '.', 'ok', 2200); }
                      else toast('Nothing selected', 'Click items on the sheet (or in the layers list) first.', 'warn'); },
  'ed-layer':      t => { const id = t.dataset.id;
                      ED.sel.has(id) ? ED.sel.delete(id) : ED.sel.add(id); ED_paint(); },
  'ed-del-item':   t => { ED.items = ED.items.filter(i => i.id !== t.dataset.id); ED_selPrune(); ED_commit(); },
  'ed-select-all': () => { ED.sel = new Set(ED.items.map(i => i.id)); ED_paint(); },
  'ed-edit':      () => { const it = ED.items.find(i => ED.sel.has(i.id)); if (it) openItemModal(it); },
  'ed-dup':       () => ED_dupSel(),
  'ed-rotl':      () => ED_rotate(-1),
  'ed-rotr':      () => ED_rotate(1),
  'ed-del':       () => ED_delSel(),
  'ed-optimize':  () => ED_optimize(),
  'ed-preflight': () => openPreflightModal(),
  'ed-sample-layout': () => edSampleLayout(),
  'ed-clear':     () => { if (!ED.items.length) return; ED.items = []; ED.sel.clear(); ED_commit();
                      toast('Sheet cleared', 'All items removed — the sheet is blank again.', 'info', 1800); },
  'ed-zoom-in':   () => { ED.zoom = clamp(ED.zoom * 1.15, .3, 3); ED_applyScale(); },
  'ed-zoom-out':  () => { ED.zoom = clamp(ED.zoom / 1.15, .3, 3); ED_applyScale(); },
  'ed-fit':       () => { ED.zoom = 1; ED_fit(); },
  'ed-left-toggle': () => { const l = $('#ed-left'); if (l) l.classList.toggle('open'); },
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t){ closeDropdowns(); return; }
  const act = t.dataset.act;
  if (act !== 'user-menu' && act !== 'align-dd') closeDropdowns();
  const fn = ACT[act];
  if (fn){ e.preventDefault(); fn(t, e); }
});

/* Escape closes non-static modals */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#modal-root')?.children.length && !MODAL_STATIC) closeModal();
});

/* ---------------- form delegation ---------------- */
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]');
  if (!f) return;
  e.preventDefault();
  const kind = f.dataset.form;
  const fd = new FormData(f);
  const g = k => String(fd.get(k) ?? '').trim();

  if (kind === 'login'){
    const email = g('email').toLowerCase();
    const u = DB.users.find(x => x.email.toLowerCase() === email);
    if (!u){ toast('Account not found', 'No account for that email — try a demo business below, or create an account.', 'err'); return; }
    if (!g('password')){ toast('Password needed', 'Demo accounts accept the password demo123.', 'warn'); return; }
    DB.session = { businessId: u.businessId }; save();
    go('dashboard');
    toast('Welcome back', 'Signed in as ' + DB.businesses[u.businessId].name + '.', 'ok');
    return;
  }

  if (kind === 'register'){
    const name = g('biz'), email = g('email');
    if (name.length < 2 || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email) || g('password').length < 4){
      toast('Check the form', 'A business name, a valid email and a password (4+ characters) are needed.', 'warn'); return; }
    if (DB.users.some(x => x.email.toLowerCase() === email.toLowerCase())){
      toast('Email already in use', 'That email has an account — sign in instead.', 'err'); return; }
    const id = 'b' + uid();
    DB.businesses[id] = { id, name, contact: g('contact') || email.split('@')[0], email, tagline: '',
      colors: { primary:'#ff6b2b', secondary:'#f5ead9' },
      logo: makeLogo(name, '#ff6b2b', '#f5ead9', 'flame'), glyph: 'flame',
      addr: { street:'', city:'', state:'', zip:'' }, isDemo: false };
    DB.users.push({ email, businessId: id, demo: false });
    DB.session = { businessId: id }; ED_reset(); save();
    go('dashboard');
    toast('Account created', 'Welcome to Evil Transfers — start by saving your branding, then add your people.', 'ok');
    return;
  }

  if (kind === 'branding'){
    const b = currentBiz();
    b.name = g('name') || b.name;
    b.contact = g('contact') || b.contact;
    b.tagline = g('tagline');
    if (/^#[0-9a-fA-F]{6}$/.test(g('primary'))) b.colors.primary = g('primary');
    if (/^#[0-9a-fA-F]{6}$/.test(g('secondary'))) b.colors.secondary = g('secondary');
    if (!b.uploadedLogo) b.logo = makeLogo(b.name, b.colors.primary, b.colors.secondary, b.glyph || 'flame');
    save(); render();
    toast('Branding saved', 'Your logo and colors now apply across every template.', 'ok');
    return;
  }

  if (kind === 'emp'){
    const id = f.dataset.e, name = g('name');
    if (name.length < 2){ toast('Name required', 'Enter the employee\u2019s full name (first and last).', 'warn'); return; }
    const initials = (g('initials') || initialsOf(name)).toUpperCase();
    if (id){
      const emp = empById(id);
      if (emp) Object.assign(emp, { name, department: g('department'), position: g('position'), initials });
    } else {
      DB.employees.push({ id: uid(), businessId: currentBiz().id, name,
        department: g('department'), position: g('position'), initials });
    }
    save(); closeModal(); render();
    toast(id ? 'Employee updated' : 'Employee added', name + ' is ready for one-click packs.', 'ok');
    return;
  }

  if (kind === 'pack-create'){
    const emp = empById(f.dataset.e); if (!emp) return;
    const b = currentBiz();
    const saved = DB.savedTemplates.filter(t => t.businessId === b.id);
    const pick = (type, fallback) => saved.find(t => t.itemType === type)?.itemId || fallback;
    const chosen = [
      ['badge',       pick('badge', 'badge-rounded')],
      ['apron',       pick('apron', 'apron-logo-name')],
      ['shirt',       pick('chest', 'shirt-left-chest')],
      ['sweatshirt',  'sweat-chest'],
      ['hat',         pick('hat', 'hat-logo')],
    ].filter(([k]) => fd.get(k));
    if (!chosen.length){ toast('Pick at least one item', 'Choose what goes into ' + emp.name + '\u2019s pack.', 'warn'); return; }
    const items = optimizeLayout(chosen.map(([, tplId]) =>
      mkItem(tplId, { data: { name: emp.name, sub: emp.position || emp.department || '', useLogo: true } })));
    closeModal();
    ED_newSession({ items, label: emp.name + ' — Team Pack' });
    toast('Pack generated', chosen.length + ' item types pre-filled for ' + emp.name + ' and auto-arranged. Run PREFLIGHT when ready.', 'ok');
    return;
  }

  if (kind === 'checkout'){
    if (!validateCheckout(f)) return;
    const btn = $('#pay-btn');
    if (btn){ btn.disabled = true; btn.innerHTML = ic('clock',14) + ' PROCESSING PAYMENT (DEMO)\u2026'; }
    const b = currentBiz();
    setTimeout(() => {
      const addr = { name: g('sname'), street: g('sstreet'), city: g('scity'), state: g('sstate'), zip: g('szip') };
      const contact = { name: g('cname'), email: g('cemail') };
      const o = createOrder(b.id, cartFor(b.id), addr, contact);
      DB.carts[b.id] = [];
      save();
      go('confirm', { orderId: o.num });
    }, 1000);
    return;
  }

  if (kind === 'add-cart'){
    const b = currentBiz();
    const label = g('label') || 'Custom Transfer Sheet';
    const qty = clamp(parseInt(g('qty'), 10) || 1, 1, 20);
    const sheet = { id: ED.cartSheetId || uid(), label, items: deep(ED.items),
      brand: { name: b.name, tagline: b.tagline, colors: deep(b.colors), logo: b.logo },
      contents: sheetContents(ED.items), qty, unit: sheetUnitPrice(ED.items) };
    const cart = cartFor(b.id);
    if (ED.cartSheetId){
      const i = cart.findIndex(x => x.id === ED.cartSheetId);
      if (i >= 0) cart[i] = sheet; else cart.push(sheet);
    } else cart.push(sheet);
    save(); closeModal();
    go('cart');
    toast('Added to cart', label + ' — ' + sheet.contents.join(', ') + '.', 'ok');
    return;
  }

  if (kind === 'item-edit'){
    const it = ED.items.find(i => i.id === f.dataset.id);
    if (!it){ closeModal(); return; }
    applyItemForm(it, fd);
    closeModal(); ED_commit();
    toast('Item updated', 'Changes applied to the sheet.', 'ok', 1800);
    return;
  }

  if (kind === 'save-template'){
    const src = ED.items.find(i => i.id === f.dataset.id);
    if (!src){ closeModal(); return; }
    const name = g('name') || (TYPE_NAMES[src.type] + ' — ' + (src.data?.name || 'Custom'));
    DB.savedTemplates.push({ id: uid(), businessId: currentBiz().id, name,
      cat: CAT_FOR_TYPE[src.type] || 'CUSTOM DESIGNS',
      itemId: STOCK_DEFAULT[src.type] || src.type, itemType: src.type,
      d: deep(src.data || {}), w: src.w, h: src.h, note: g('note') });
    save(); closeModal();
    toast('Template saved', name + ' is now reusable from your library and employee packs.', 'ok');
    return;
  }
});

/* ---------------- boot ---------------- */
document.addEventListener('visibilitychange', () => { if (document.hidden) saveDB(); });
loadDB();
go(currentBiz() ? 'dashboard' : 'landing');
PROD.start();

/* test / demo hooks — harmless in production, handy for walkthroughs */
window.__ET = {
  get state(){ return DB; },
  go, toast, loginAs,
  order: num => orderByNum(num),
  wake: () => PROD.wake(),
  complete: () => { const c = PROD.current(); if (c) PROD.complete(c); return !!c; },
  error: () => PROD.simulateError(),
  pace: ms => { DB.settings.pace = ms; DB.printer.dur = ms; save(); },
  qcPass: id => PROD.qcPass(orderByNum(id)),
  reset: () => resetDemoData(),
};
</script>
</body>
</html>
