<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evil Transfers — Small-Batch Custom Transfer Sheets</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%23141416'/%3E%3Cpath d='M20 7c1.2 4 4.3 5.8 6 8.3 1.5 2.3 2.3 4.4 2.3 6.7a8.3 8.3 0 0 1-16.6 0c0-2 .7-3.8 1.8-5.5 1-1.6 3.8-4.4 4.7-5.6.6-.9 1-2 1-3.9z' fill='%23ff5a1f'/%3E%3Cpath d='M20 17c.6 2.1 2.1 3 2.9 4.3.7 1.1 1.1 2.2 1.1 3.4a4 4 0 0 1-8 0c0-1 .4-1.9 1-2.8.5-.8 1.9-2.2 2.4-2.8.3-.5.5-1 .6-2.1z' fill='%23ffb020'/%3E%3C/svg%3E">
<style>
/* ============================================================
   EVIL TRANSFERS — PROTOTYPE STYLESHEET
   Dark industrial design system: charcoal / ember / hot yellow
   ============================================================ */
:root{
  --bg0:#0a0a0c; --bg1:#121215; --bg2:#17171b; --bg3:#1e1e24;
  --ln:#26262d; --ln2:#35353e;
  --ink:#edeae3; --mut:#a29fa8; --dim:#726f78;
  --ember:#ff5a1f; --ember2:#ff7c42; --hot:#ffb020; --hot2:#ffd166;
  --red:#ef5350; --red2:#ff7b78; --grn:#4cc38a; --blu:#6ea8ff;
  --ember-dim:rgba(255,90,31,.13); --hot-dim:rgba(255,176,32,.12);
  --red-dim:rgba(239,83,80,.12); --grn-dim:rgba(76,195,138,.12);
  --font:'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif;
  --mono:ui-monospace,'Cascadia Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace;
  --r:10px;
  --sh:0 14px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;font:15px/1.55 var(--font);color:var(--ink);
  background:radial-gradient(1100px 520px at 78% -12%,rgba(255,90,31,.055),transparent 60%),
             radial-gradient(900px 500px at -10% 110%,rgba(255,176,32,.03),transparent 55%),
             var(--bg0);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
h1,h2,h3,h4{margin:0 0 .45em;font-weight:800;letter-spacing:-.01em;line-height:1.15}
h1{font-size:clamp(28px,4vw,44px)}
h2{font-size:22px}
h3{font-size:16px}
p{margin:0 0 1em}
a{color:var(--ember2);text-decoration:none}
a:hover{color:var(--hot)}
img{max-width:100%}
::selection{background:rgba(255,90,31,.4)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2b2b33;border-radius:6px;border:2px solid var(--bg0)}
::-webkit-scrollbar-thumb:hover{background:#3a3a44}
.mono{font-family:var(--mono)}
.tnum{font-variant-numeric:tabular-nums}
.eyebrow{font:700 11px var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--ember);margin:0 0 10px}
.sub{color:var(--mut)}
.dim{color:var(--dim)}
.small{font-size:12.5px}
.right{text-align:right}
.nowrap{white-space:nowrap}
.spacer{flex:1}
.hide{display:none!important}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  font:700 11.5px var(--font);letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink);background:var(--bg2);border:1px solid var(--ln2);
  padding:9px 16px;border-radius:8px;cursor:pointer;user-select:none;
  transition:all .16s ease;white-space:nowrap;text-decoration:none;
}
.btn:hover{border-color:#4a4a55;background:var(--bg3);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.pri{
  background:linear-gradient(180deg,#ff6a2e,#f04e12);border-color:#ff7c42;color:#fff;
  box-shadow:0 4px 18px rgba(255,90,31,.28);
}
.btn.pri:hover{box-shadow:0 6px 26px rgba(255,90,31,.45);filter:brightness(1.07)}
.btn.hot{background:linear-gradient(180deg,#ffc23d,#f5a300);border-color:#ffc23d;color:#191405}
.btn.hot:hover{filter:brightness(1.07);box-shadow:0 4px 18px rgba(255,176,32,.3)}
.btn.dgr{background:var(--red-dim);border-color:rgba(239,83,80,.45);color:var(--red2)}
.btn.dgr:hover{background:rgba(239,83,80,.22)}
.btn.ok{background:var(--grn-dim);border-color:rgba(76,195,138,.45);color:var(--grn)}
.btn.ok:hover{background:rgba(76,195,138,.22)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--mut)}
.btn.ghost:hover{color:var(--ink);background:var(--bg2);border-color:transparent}
.btn.sm{padding:6px 11px;font-size:10.5px;border-radius:7px}
.btn.blk{width:100%}
.btn:disabled,.btn.off{opacity:.38;pointer-events:none}
.btn:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.btn .ico{flex:0 0 auto}
.linkbtn{background:none;border:none;color:var(--ember2);cursor:pointer;font:inherit;padding:0}
.linkbtn:hover{color:var(--hot);text-decoration:underline}

/* ---------- icon ---------- */
.ico{display:inline-flex;align-items:center;justify-content:center;vertical-align:-3px}
.ico svg{width:100%;height:100%;display:block}

/* ---------- chips / tags / status ---------- */
.chip{
  display:inline-flex;align-items:center;gap:6px;font:700 10.5px var(--mono);
  letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:99px;
  border:1px solid var(--ln2);background:var(--bg2);color:var(--mut);white-space:nowrap;
}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 auto}
.st-queued{color:#b9b6bf;border-color:#43434d;background:rgba(255,255,255,.04)}
.st-printing{color:var(--hot);border-color:rgba(255,176,32,.5);background:var(--hot-dim)}
.st-qc{color:var(--hot2);border-color:rgba(255,209,102,.4);background:rgba(255,209,102,.08)}
.st-ready{color:var(--grn);border-color:rgba(76,195,138,.45);background:var(--grn-dim)}
.st-shipped{color:#9ad3b6;border-color:rgba(76,195,138,.3);background:rgba(76,195,138,.07)}
.st-attention,.st-reprint{color:var(--red2);border-color:rgba(239,83,80,.5);background:var(--red-dim)}
.st-cancelled{color:var(--dim);border-color:var(--ln2);background:var(--bg1);text-decoration:line-through}
.chip.pulse .dot{animation:pulse 1.2s infinite}
.chip.pulse{animation:chipGlow 1.6s infinite}
@keyframes chipGlow{0%,100%{box-shadow:0 0 0 0 rgba(255,176,32,0)}50%{box-shadow:0 0 12px 0 rgba(255,176,32,.25)}}
.tag{display:inline-flex;align-items:center;gap:5px;font:800 9.5px var(--mono);letter-spacing:.12em;
  text-transform:uppercase;padding:3px 7px;border-radius:5px;background:var(--hot);color:#191405}
.tag.demo{background:var(--hot-dim);color:var(--hot);border:1px dashed rgba(255,176,32,.55)}
.tag.red{background:var(--red-dim);color:var(--red2);border:1px solid rgba(239,83,80,.4)}
.tag.ember{background:var(--ember-dim);color:var(--ember2);border:1px solid rgba(255,124,66,.4)}

/* ---------- cards / panels ---------- */
.card{background:var(--bg1);border:1px solid var(--ln);border-radius:var(--r);padding:18px}
.card.pad-lg{padding:26px}
.panel{background:var(--bg1);border:1px solid var(--ln);border-radius:var(--r);overflow:hidden}
.panel-head{
  display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--ln);
  background:linear-gradient(180deg,var(--bg2),var(--bg1));
}
.panel-head h3{margin:0;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);font-weight:800}
.panel-body{padding:16px}
.hz{height:5px;background:repeating-linear-gradient(-45deg,var(--hot) 0 11px,#151517 11px 22px);border-radius:2px}
.hz.thin{height:3px}
.divider{height:1px;background:var(--ln);margin:16px 0;border:0}

/* ---------- forms ---------- */
.field{margin-bottom:14px}
.lbl{display:flex;align-items:center;gap:6px;font:700 11px var(--font);letter-spacing:.1em;
  text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.inp,.sel,textarea.inp{
  width:100%;background:var(--bg2);border:1px solid var(--ln2);color:var(--ink);
  border-radius:8px;padding:10px 12px;font:500 14px var(--font);transition:border .15s,box-shadow .15s;
}
.inp:focus,.sel:focus{outline:none;border-color:var(--ember);box-shadow:0 0 0 3px rgba(255,90,31,.15)}
.inp.bad{border-color:var(--red);box-shadow:0 0 0 3px rgba(239,83,80,.12)}
.inp::placeholder{color:#5b5960}
.sel{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);
  background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat}
textarea.inp{resize:vertical;min-height:70px}
.err-msg{display:none;color:var(--red2);font:500 11.5px var(--font);margin-top:5px}
.err-msg.show{display:block}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.check{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border:1px solid var(--ln);
  border-radius:8px;background:var(--bg2);cursor:pointer;transition:all .15s;margin-bottom:8px}
.check:hover{border-color:var(--ln2)}
.check input{accent-color:var(--ember);width:16px;height:16px;margin-top:1px;flex:0 0 auto;cursor:pointer}
.check .cl{font:700 13px var(--font)}
.check .cd{font:400 11.5px var(--font);color:var(--dim);margin-top:2px}
.color-row{display:flex;gap:8px;align-items:center}
input[type=color]{width:44px;height:38px;border:1px solid var(--ln2);border-radius:8px;background:var(--bg2);cursor:pointer;padding:3px}

/* ---------- header ---------- */
.top{
  position:sticky;top:0;z-index:60;height:60px;display:flex;align-items:center;gap:22px;
  padding:0 22px;background:rgba(12,12,14,.82);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--ln);
}
.top.prod{background:rgba(20,12,8,.9);border-bottom-color:rgba(255,90,31,.35)}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer;flex:0 0 auto}
.brand-mark{width:34px;height:34px;border-radius:8px;background:#141416;border:1px solid rgba(255,90,31,.55);
  display:flex;align-items:center;justify-content:center;box-shadow:0 0 16px rgba(255,90,31,.22)}
.brand-word{font:800 15px var(--font);letter-spacing:.1em;color:var(--ink);white-space:nowrap}
.brand-word b{color:var(--ember);font-weight:800}
.brand-word small{display:block;font:600 8px var(--mono);letter-spacing:.3em;color:var(--dim);margin-top:1px}
.top-nav{display:flex;gap:4px;align-items:center}
.top-nav a{
  font:700 12px var(--font);letter-spacing:.06em;color:var(--mut);padding:8px 12px;
  border-radius:7px;cursor:pointer;transition:all .15s;text-transform:uppercase;
}
.top-nav a:hover{color:var(--ink);background:var(--bg2)}
.top-nav a.on{color:var(--hot);background:var(--hot-dim)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.proto-chip{font:700 9px var(--mono);letter-spacing:.18em;color:var(--dim);border:1px solid var(--ln);
  padding:3px 7px;border-radius:5px;text-transform:uppercase}
.cartbtn{position:relative}
.cartdot{
  position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:99px;
  background:var(--ember);color:#fff;font:800 10px var(--mono);display:flex;align-items:center;
  justify-content:center;box-shadow:0 0 8px rgba(255,90,31,.6);
}
.userbtn{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:8px;cursor:pointer;
  border:1px solid transparent;transition:all .15s;position:relative}
.userbtn:hover{background:var(--bg2);border-color:var(--ln)}
.avatar{width:30px;height:30px;border-radius:8px;background:var(--ember-dim);border:1px solid rgba(255,124,66,.4);
  color:var(--ember2);display:flex;align-items:center;justify-content:center;font:800 12px var(--font)}
.userbtn .un{font:700 12.5px var(--font);color:var(--ink);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.userbtn .ur{font:600 9.5px var(--mono);letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.menu-dd{position:relative}
.menu-dd .dd{
  position:absolute;right:0;top:calc(100% + 8px);min-width:230px;background:var(--bg1);
  border:1px solid var(--ln2);border-radius:10px;box-shadow:var(--sh);padding:6px;
  opacity:0;transform:translateY(-6px) scale(.98);pointer-events:none;transition:all .18s ease;z-index:70;
}
.menu-dd.open .dd{opacity:1;transform:none;pointer-events:auto}
.dd .ddh{padding:9px 11px;border-bottom:1px solid var(--ln);margin-bottom:5px}
.dd .ddh b{display:block;font-size:13px}
.dd .ddh span{font-size:11px;color:var(--dim)}
.ddi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 11px;border:0;
  background:none;color:var(--mut);font:600 13px var(--font);border-radius:7px;cursor:pointer}
.ddi:hover{background:var(--bg2);color:var(--ink)}
.ddi.dgr:hover{background:var(--red-dim);color:var(--red2)}
.dd-sep{height:1px;background:var(--ln);margin:5px 8px}
.dd-label{font:700 9.5px var(--mono);letter-spacing:.16em;color:var(--dim);text-transform:uppercase;padding:8px 11px 4px}
</style>
<style>
/* ---------- main layout ---------- */
.main{max-width:1240px;margin:0 auto;padding:30px 26px 90px;min-height:calc(100vh - 60px)}
.main.tight{max-width:820px}
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-head h1{margin:0;font-size:26px}
.page-head .ph-sub{color:var(--dim);font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-top:6px}
.page-head .spacer{flex:1}
.fade-in{animation:fadeUp .35s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.empty{
  text-align:center;padding:56px 20px;border:1.5px dashed var(--ln2);border-radius:12px;
  color:var(--dim);background:rgba(255,255,255,.012);
}
.empty .ico{color:var(--ln2);margin-bottom:14px}
.empty h3{color:var(--mut);font-size:15px;margin-bottom:6px}
.empty p{font-size:13px;max-width:420px;margin:0 auto 18px}

/* ---------- landing ---------- */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:54px;align-items:center;padding:64px 0 58px}
.hero h1{font-size:clamp(34px,4.6vw,56px);line-height:1.04;letter-spacing:-.02em}
.hero h1 .em{color:var(--ember)}
.hero h1 .hot{color:var(--hot)}
.hero .lede{font-size:16.5px;color:var(--mut);max-width:520px;margin:20px 0 30px}
.hero-ctas{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:30px}
.hero-stats{display:flex;gap:22px;flex-wrap:wrap}
.hstat{border-left:2px solid var(--ember);padding-left:12px}
.hstat b{display:block;font:800 19px var(--font);color:var(--ink)}
.hstat span{font:600 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.hero-fig{position:relative}
.hero-fig .cap{
  text-align:center;font:600 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);margin-top:14px;
}
.hero-glow{position:absolute;inset:-40px;background:radial-gradient(closest-side,rgba(255,90,31,.14),transparent);
  z-index:-1;filter:blur(10px)}
.sect{padding:52px 0;border-top:1px solid var(--ln)}
.sect-head{max-width:640px;margin-bottom:34px}
.props{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.prop{background:var(--bg1);border:1px solid var(--ln);border-radius:12px;padding:22px;transition:all .2s}
.prop:hover{border-color:rgba(255,124,66,.45);transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.35)}
.prop .pi{width:38px;height:38px;border-radius:9px;background:var(--ember-dim);color:var(--ember2);
  display:flex;align-items:center;justify-content:center;margin-bottom:14px;border:1px solid rgba(255,124,66,.3)}
.prop h3{font-size:14.5px;margin-bottom:7px}
.prop p{font-size:12.5px;color:var(--mut);margin:0;line-height:1.5}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;counter-reset:step}
.step{position:relative;padding:26px 26px 26px 0}
.step+.step{border-left:1px solid var(--ln);padding-left:26px}
.step .n{
  font:800 13px var(--mono);color:var(--ember);letter-spacing:.15em;display:flex;align-items:center;gap:10px;margin-bottom:12px;
}
.step .n::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(255,90,31,.5),transparent)}
.step h3{font-size:14.5px;margin-bottom:7px}
.step p{font-size:12.5px;color:var(--mut);margin:0}
.demo-panel{
  display:flex;align-items:center;gap:26px;flex-wrap:wrap;background:linear-gradient(120deg,var(--bg1),#181a1e);
  border:1px solid var(--ln2);border-radius:14px;padding:28px 30px;
}
.demo-panel .dp-copy{flex:1;min-width:260px}
.demo-panel .dp-copy h3{font-size:17px;margin-bottom:6px}
.demo-panel .dp-copy p{font-size:13px;color:var(--mut);margin:0}
.demo-panel .dp-btns{display:flex;gap:10px;flex-wrap:wrap}
.foot{border-top:1px solid var(--ln);padding:30px 0 50px;color:var(--dim);font:500 12px var(--font);
  display:flex;gap:18px;align-items:center;flex-wrap:wrap}

/* ---------- auth ---------- */
.auth-wrap{display:grid;grid-template-columns:.95fr 1.05fr;min-height:calc(100vh - 60px);max-width:1120px;margin:0 auto}
.auth-side{padding:70px 60px;border-right:1px solid var(--ln);display:flex;flex-direction:column;justify-content:center}
.auth-side h1{font-size:32px;line-height:1.1}
.auth-side .lede{color:var(--mut);margin:18px 0 34px;max-width:420px}
.auth-points{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.auth-points li{display:flex;gap:12px;align-items:center;color:var(--mut);font-size:13.5px}
.auth-points .ico{color:var(--grn);flex:0 0 auto}
.auth-main{padding:56px 60px;display:flex;align-items:center;justify-content:center}
.auth-card{width:100%;max-width:420px}
.tabbar{display:flex;background:var(--bg2);border:1px solid var(--ln);border-radius:10px;padding:4px;margin-bottom:26px}
.tabbar button{
  flex:1;padding:9px;border:0;background:none;color:var(--dim);font:700 12px var(--font);
  letter-spacing:.08em;text-transform:uppercase;border-radius:7px;cursor:pointer;transition:all .15s;
}
.tabbar button.on{background:var(--bg0);color:var(--hot);box-shadow:0 2px 10px rgba(0,0,0,.4)}
.demo-list{margin-top:26px;border-top:1px dashed var(--ln2);padding-top:20px}
.demo-list .dl-h{font:700 10px var(--mono);letter-spacing:.18em;color:var(--dim);text-transform:uppercase;margin-bottom:12px}
.demo-acc{
  display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:1px solid var(--ln);
  background:var(--bg2);border-radius:9px;cursor:pointer;margin-bottom:8px;transition:all .15s;text-align:left;
}
.demo-acc:hover{border-color:rgba(255,124,66,.5);background:var(--bg3);transform:translateX(3px)}
.demo-acc .avatar{border-radius:50%}
.demo-acc b{display:block;font-size:13px;color:var(--ink)}
.demo-acc span{font-size:11px;color:var(--dim)}
.demo-acc .go{margin-left:auto;color:var(--ember);font:800 10px var(--mono);letter-spacing:.1em}
.hint-box{background:var(--bg2);border:1px solid var(--ln);border-radius:8px;padding:10px 12px;
  font-size:11.5px;color:var(--dim);margin-top:16px;line-height:1.5}
.hint-box b{color:var(--mut)}

/* ---------- dashboard ---------- */
.dash-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.dash-welcome{grid-column:span 12;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.biz-badge{display:flex;align-items:center;gap:14px}
.biz-badge img{width:52px;height:52px;border-radius:12px;border:1px solid var(--ln2);background:#141416}
.qa-grid{grid-column:span 12;display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.qa{
  display:flex;flex-direction:column;gap:12px;align-items:flex-start;padding:16px;background:var(--bg1);
  border:1px solid var(--ln);border-radius:11px;cursor:pointer;transition:all .18s;
}
.qa:hover{border-color:rgba(255,124,66,.55);transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.35)}
.qa .ico{color:var(--ember2)}
.qa b{font-size:13px;color:var(--ink)}

.dim-v i::before,.dim-v i::after{width:7px;height:1px;left:-3px;top:0}
.dim-v i::after{top:auto;bottom:0}
.ed-row{display:flex;align-items:flex-start}
.dim-note{margin:9px 0 0 22px;font:600 9.5px var(--mono);letter-spacing:.14em;color:var(--dim);text-transform:uppercase;text-align:center}

/* THE PHYSICAL SHEET */
.sh{
  position:relative;background:#efece5;border-radius:5px;flex:0 0 auto;
  box-shadow:0 24px 60px rgba(0,0,0,.6),0 0 0 1px #d6d1c4,0 0 46px rgba(255,90,31,.06);
}
.sh-area{position:absolute;overflow:hidden;outline:1.5px dashed rgba(255,90,31,.6);outline-offset:-1.5px;background:#fbfaf7}
.sh-grid0{position:absolute;inset:0;pointer-events:none}
.sh-mark{
  position:absolute;left:0;right:0;text-align:center;color:#b3ad9e;font-weight:600;
  letter-spacing:.28em;text-transform:uppercase;pointer-events:none;white-space:nowrap;
}
.guide{position:absolute;background:rgba(255,90,31,.65);pointer-events:none;z-index:60;display:none}
#guide-v{width:1px;top:0;bottom:0}
#guide-h{height:1px;left:0;right:0}
.sheet-item{position:absolute;cursor:grab;touch-action:none}
.sheet-item:active{cursor:grabbing}
.sheet-item .si-c{width:100%;height:100%;overflow:hidden;pointer-events:none}
.sheet-item.sel{outline:2px solid var(--ember);outline-offset:1px;z-index:20}
.sheet-item.oob{outline:2px dashed var(--red);outline-offset:1px}
.sheet-item .si-c .placeholder-note{color:#b9b3a4}
.si-h{
  position:absolute;right:-8px;bottom:-8px;width:15px;height:15px;background:#fff;
  border:2.5px solid var(--ember);border-radius:4px;cursor:nwse-resize;z-index:30;
  box-shadow:0 2px 8px rgba(0,0,0,.3);
}
.si-r{
  position:absolute;left:50%;top:-30px;width:15px;height:15px;margin-left:-7.5px;background:#fff;
  border:2.5px solid var(--ember);border-radius:50%;cursor:grab;z-index:30;
  box-shadow:0 2px 8px rgba(0,0,0,.3);
}
.si-r::before{content:'';position:absolute;left:50%;top:14px;height:15px;width:2px;background:var(--ember);margin-left:-1px}
.ed-status{
  display:flex;align-items:center;gap:16px;padding:8px 16px;background:var(--bg1);border-top:1px solid var(--ln);
  font:600 10.5px var(--mono);letter-spacing:.06em;color:var(--dim);flex-wrap:wrap;row-gap:6px;
}
.ed-status .warnbox{color:var(--red2);font-weight:700}
.ed-status .okbox{color:var(--grn);font-weight:700}
.st-chip{display:inline-flex;align-items:center;gap:6px;text-transform:uppercase}
.st-chip i{width:6px;height:6px;border-radius:2px;background:currentColor;display:inline-block}
.ed-empty-hint{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;pointer-events:none;z-index:5}
.ed-empty-hint .card{pointer-events:auto;max-width:330px;text-align:center}
.ed-empty-hint h3{font-size:15px}
.ed-empty-hint p{font-size:12.5px;color:var(--mut);margin:0 0 14px}
.ed-empty-btns{display:flex;flex-direction:column;gap:8px}

/* preflight modal */
.pf-row{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-radius:9px;margin-bottom:8px;
  background:var(--bg2);border:1px solid var(--ln)}
.pf-row .ico{flex:0 0 auto;margin-top:1px}
.pf-row.ok{border-color:rgba(76,195,138,.3)}
.pf-row.ok .ico{color:var(--grn)}
.pf-row.warn{border-color:rgba(255,176,32,.4)}
.pf-row.warn .ico{color:var(--hot)}
.pf-row.bad{border-color:rgba(239,83,80,.45)}
.pf-row.bad .ico{color:var(--red)}
.pf-row b{display:block;font-size:13px;margin-bottom:2px}
.pf-row .pf-d{font-size:11.5px;color:var(--mut);line-height:1.5}
.pf-row .pf-fix{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.pf-sum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.ready-banner{
  display:flex;align-items:center;justify-content:center;gap:12px;background:var(--grn-dim);
  border:1.5px solid rgba(76,195,138,.5);color:var(--grn);border-radius:10px;padding:14px;
  font:800 16px var(--mono);letter-spacing:.22em;text-transform:uppercase;margin:14px 0;
}
.blocked-banner{
  display:flex;align-items:center;justify-content:center;gap:12px;background:var(--red-dim);
  border:1.5px solid rgba(239,83,80,.5);color:var(--red2);border-radius:10px;padding:14px;
  font:800 14px var(--mono);letter-spacing:.16em;text-transform:uppercase;margin:14px 0;
}

/* ---------- modal ---------- */
.modal-bg{
  position:fixed;inset:0;background:rgba(6,6,8,.72);backdrop-filter:blur(4px);z-index:200;
  display:flex;align-items:flex-start;justify-content:center;padding:5vh 18px;overflow-y:auto;
  animation:fadeIn .18s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--bg1);border:1px solid var(--ln2);border-radius:14px;box-shadow:var(--sh);
  width:100%;max-width:560px;animation:popIn .22s cubic-bezier(.2,1.4,.4,1);margin:auto 0;
}
.modal.lg{max-width:760px}
.modal.md{max-width:640px}
@keyframes popIn{from{opacity:0;transform:scale(.94) translateY(12px)}to{opacity:1;transform:none}}
.m-head{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--ln)}
.m-head h3{margin:0;font-size:16px;flex:1}
.m-x{background:none;border:0;color:var(--dim);cursor:pointer;padding:6px;border-radius:7px;display:flex}
.m-x:hover{color:var(--ink);background:var(--bg2)}
.m-body{padding:20px 22px;max-height:64vh;overflow-y:auto}
.m-foot{display:flex;gap:10px;justify-content:flex-end;padding:16px 22px;border-top:1px solid var(--ln);flex-wrap:wrap}
.m-foot .left{margin-right:auto}

/* ---------- toasts ---------- */
#toast-root{position:fixed;right:20px;bottom:20px;z-index:300;display:flex;flex-direction:column;gap:10px;max-width:380px}
.toast{
  display:flex;gap:12px;align-items:flex-start;background:var(--bg2);border:1px solid var(--ln2);
  border-left:3px solid var(--ember);border-radius:10px;padding:13px 16px;box-shadow:var(--sh);
  animation:toastIn .25s cubic-bezier(.2,1.2,.4,1);font-size:13px;color:var(--ink);
}
.toast.ok{border-left-color:var(--grn)}.toast.ok .ico{color:var(--grn)}
.toast.warn{border-left-color:var(--hot)}.toast.warn .ico{color:var(--hot)}
.toast.err{border-left-color:var(--red)}.toast.err .ico{color:var(--red)}
.toast.info .ico{color:var(--ember2)}
.toast b{display:block;font-size:12.5px;margin-bottom:2px}
.toast span{color:var(--mut);font-size:12px;line-height:1.45}
.toast.out{animation:toastOut .25s forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateX(30px)}}

/* ---------- tooltip ---------- */
[data-tip]{position:relative}
[data-tip]::after{
  content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%) scale(.94);
  background:#26262d;color:var(--ink);font:600 10.5px var(--font);letter-spacing:.02em;white-space:nowrap;
  padding:5px 9px;border-radius:6px;border:1px solid var(--ln2);opacity:0;pointer-events:none;
  transition:all .14s;z-index:150;box-shadow:0 6px 16px rgba(0,0,0,.4);text-transform:none;
}
[data-tip]:hover::after{opacity:1;transform:translateX(-50%) scale(1)}

/* ---------- responsive ---------- */
@media (max-width:1080px){
  .hero{grid-template-columns:1fr;padding:40px 0;gap:30px}
  .props{grid-template-columns:1fr 1fr}
  .steps{grid-template-columns:1fr 1fr;gap:18px}
  .step+.step{border-left:0;padding-left:0}
  .prod-stats{grid-template-columns:repeat(3,1fr)}
  .prod-grid{grid-template-columns:1fr}
  .qa-grid{grid-template-columns:repeat(3,1fr)}
  .dash-col-l,.dash-col-r{grid-column:span 12}
  .top-nav a{padding:8px 8px}
  .auth-wrap{grid-template-columns:1fr}
  .auth-side{border-right:0;border-bottom:1px solid var(--ln);padding:40px 26px}
  .auth-main{padding:34px 26px}
}
@media (max-width:900px){
  .ed-body{grid-template-columns:1fr}
  .ed-left{
    position:absolute;left:0;top:0;bottom:0;z-index:90;width:248px;transform:translateX(-100%);
    transition:transform .22s ease;box-shadow:var(--sh);
  }
  .ed-left.open{transform:none}
  .ed-canvas{background:#0c0c0f}
  .cart-grid,.co-grid{grid-template-columns:1fr}
  .summary-card{position:static}
  .onboard{grid-template-columns:1fr}
  .ord-detail-meta{grid-template-columns:1fr 1fr}
}
@media (max-width:720px){
  .main{padding:20px 16px 70px}
  .top{gap:10px;padding:0 12px;overflow-x:auto}
  .brand-word small{display:none}
  .props{grid-template-columns:1fr}
  .qa-grid{grid-template-columns:1fr 1fr}
  .prod-stats{grid-template-columns:repeat(2,1fr)}
  .row3{grid-template-columns:1fr}
  .tpl-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .userbtn .un,.userbtn .ur{display:none}
  .sheet-card{flex-direction:column}
  .hero-ctas .btn{flex:1;justify-content:center}
}
@media (max-width:520px){
  .top-nav{display:none}
  .qa-grid{grid-template-columns:1fr}
  .row2{grid-template-columns:1fr}
}
</style>
</head>

/* generated business logo (offline SVG data-URL) */
function makeLogo(name, primary, secondary, glyph){
  const words = String(name).replace(/[^A-Za-z ]/g,'').trim().split(/\s+/).filter(Boolean);
  const ini = ((words[0]||'E')[0] + ((words[1]||'')[0] || '')).toUpperCase();
  const nm = words.map(w => w[0]).join('').slice(0, 3).toUpperCase();
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">`
    + `<rect x="3" y="3" width="114" height="114" rx="20" fill="#141416"/>`
    + `<rect x="3" y="3" width="114" height="114" rx="20" fill="none" stroke="${primary}" stroke-width="4"/>`
    + `<g transform="translate(42 14) scale(.3)">${GLYPHS[glyph](primary)}</g>`
    + `<text x="60" y="86" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="800" fill="${primary}" text-anchor="middle">${ini}</text>`
    + `<text x="60" y="104" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="4" fill="${secondary}" text-anchor="middle">${nm}</text>`
    + `</svg>`;
  return svgUrl(svg);
}

<script>
/* ============================================================
   SHEET + ITEM RENDERING — the physical 13" x 13" product
   Sheet: 13 x 13 in. Usable design area: 12.5 x 12.5 in.
   Quarter-inch margin on every side (NOT printed on).
   ============================================================ */
const SHEET_IN = 13, AREA_IN = 12.5, MARGIN_IN = 0.25, PPI = 40;

const FONT_UI = "'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif";
const FONT_SERIF = "Georgia,'Times New Roman',serif";
const FONT_MONO = "ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace";

function itemContent(it, ppi, brand){
  const px = v => Math.max(.5, Math.round(v * ppi * 100) / 100);
  const P = brand?.colors?.primary || '#ff6b2b';
  const S = brand?.colors?.secondary || '#f5ead9';
  const d = it.data || {};
  const name = d.name, sub = d.sub, ini = (d.initials || '').toUpperCase() || initialsOf(d.name);
  const logo = h => (d.useLogo !== false && brand?.logo) ? `<img src="${brand.logo}" alt="" style="height:${px(h)}px;max-width:86%;object-fit:contain">` : '';
  const nm = name ? esc(name) : `<span class="placeholder-note">ADD NAME</span>`;
  const sb = sub ? esc(sub) : '';
  const bw = Math.max(1, ppi * .05);
  const flexCol = (extra, kids) => `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:${px(.035)};width:100%;height:100%;overflow:hidden;${extra||''}">${kids}</div>`;
  const nameEl = (fs, extra) => {
    const txt = String(name || '');
    const shrink = txt.length > 11 ? Math.max(.62, 11 / txt.length) : 1;
    return `<div style="font:800 ${px(fs * shrink)}px ${FONT_UI};color:${d.ink||'#1b1b1e'};line-height:1.02;letter-spacing:.01em;white-space:nowrap;max-width:96%;overflow:hidden;${extra||''}">${nm}</div>`;
  };
  const subEl = fs => sb ? `<div style="font:600 ${px(fs)}px ${FONT_UI};color:#78767d;text-transform:uppercase;letter-spacing:.09em;line-height:1;white-space:nowrap;max-width:96%;overflow:hidden">${sb}</div>` : '';

  switch (it.type){
    case 'badge': {
      const sh = d.shape || 'rounded';
      if (sh === 'circle'){
        return flexCol('border-radius:50%;border:'+bw+'px solid '+(d.border||P)+';background:#fff;padding:6%',
          logo(it.h*.24) + nameEl(it.h*.17) + subEl(it.h*.11));
      }
      if (sh === 'modern'){
        return `<div style="display:flex;width:100%;height:100%;background:#fff;border:${bw}px solid ${d.border||P};border-radius:${px(.08)};overflow:hidden">
          <div style="flex:0 0 30%;background:${d.border||P};display:flex;align-items:center;justify-content:center;color:#fff;font:800 ${px(it.h*.3)}px ${FONT_UI}">${esc(ini)||'&nbsp;'}</div>
          <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:${px(.03)};padding:0 4%;overflow:hidden">
            ${nameEl(it.h*.24)}${subEl(it.h*.15)}
          </div></div>`;
      }
      if (sh === 'industrial'){
        return `<div style="display:flex;flex-direction:column;width:100%;height:100%;background:#fff;border:${bw}px solid ${d.border||'#2b2b30'};border-radius:${px(.05)};overflow:hidden">
          <div style="height:${px(.09)};flex:0 0 auto;background:repeating-linear-gradient(-45deg,${d.border||P} 0 ${px(.05)},#1a1a1c ${px(.05)} ${px(.1)})"></div>
          <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:${px(.03)}">
            ${nameEl(it.h*.26,'letter-spacing:.05em;text-transform:uppercase;')}${subEl(it.h*.12)}
          </div></div>`;
      }
      if (sh === 'classic'){
        return `<div style="width:100%;height:100%;background:#fff;border:${bw}px solid ${d.border||P};border-radius:${px(.04)};padding:${px(.06)}">
          <div style="width:100%;height:100%;border:1px solid ${d.border||P};border-radius:${px(.02)};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:${px(.03)}">
            ${nameEl(it.h*.22,'font-family:'+FONT_SERIF+';text-transform:none;')}${subEl(it.h*.12)}
          </div></div>`;
      }
      const radius = sh === 'square' ? px(.03) : px(.14);
      return flexCol(`border:${bw}px solid ${d.border||P};background:#fff;border-radius:${radius};padding:2% 4%`,
        (d.useLogo !== false ? logo(it.h*.3) : '') + nameEl(it.h*.27) + subEl(it.h*.15));
    }
    case 'apron': {
      const v = d.variant || 'logo-name';
      if (v === 'logo-only') return flexCol('border:' + bw*.8 + 'px solid '+(d.border||'#c9c4b6')+';background:#fff;border-radius:'+px(.06)+';padding:6%', logo(it.h*.55));
      if (v === 'name-dept') return flexCol('border:' + bw*.8 + 'px solid '+(d.border||P)+';background:#fff;border-radius:'+px(.06)+';padding:4% 6%',
        nameEl(it.h*.3) + `<div style="width:55%;height:1px;background:${d.border||P};margin:${px(.02)} 0"></div>` + subEl(it.h*.16));
      return flexCol('border:' + bw*.8 + 'px solid '+(d.border||'#c9c4b6')+';background:#fff;border-radius:'+px(.06)+';padding:4% 5%',
        logo(it.h*.4) + nameEl(it.h*.2) + subEl(it.h*.13));
    }
    case 'chest': {
      const v = d.variant || 'chest';
      const big = d.big ? 1.15 : 1;
      if (v === 'name') return flexCol('', logo(it.h*.5) + nameEl(it.h*.15) + subEl(it.h*.1));
      return flexCol('', logo(it.h*(.58*big)));
    }
    case 'back': {
      return flexCol('background:#fff;border:' + bw*.7 + 'px solid #e3ded0;border-radius:'+px(.06)+';padding:5%',
        logo(it.h*.38) +
        `<div style="font:800 ${px(it.h*.14)}px ${FONT_UI};color:${d.ink||'#1b1b1e'};letter-spacing:.08em;text-transform:uppercase;line-height:1.05;text-align:center">${esc(brand?.name || nm)}</div>` +
        (brand?.tagline ? `<div style="font:600 ${px(it.h*.065)}px ${FONT_UI};color:#8a877e;letter-spacing:.18em;text-transform:uppercase">${esc(brand.tagline)}</div>` : ''));
    }
    case 'hat': {
      const v = d.variant || 'logo';
      const inner = v === 'name' ? logo(it.h*.5) + nameEl(it.h*.11) + subEl(it.h*.08)
        : v === 'initials' ? `<div style="font:800 ${px(it.h*.42)}px ${FONT_UI};color:${d.border||P};line-height:1">${esc(ini)||'AB'}</div>`
        : v === 'emblem' ? logo(it.h*.62)
        : logo(it.h*.55);
      return flexCol('border-radius:50%;border:' + bw*1.2 + 'px solid '+(d.border||P)+';background:#fff;padding:4%', inner);
    }
    case 'bag': {
      const v = d.variant || 'name';
      const line = d.line ? `<div style="font:700 ${px(it.h*.075)}px ${FONT_UI};color:${d.border||P};letter-spacing:.2em;text-transform:uppercase;white-space:nowrap">${esc(d.line)}</div>` : '';
      const bizname = `<div style="font:800 ${px(it.h*.12)}px ${FONT_UI};color:${d.ink||'#1b1b1e'};letter-spacing:.1em;text-transform:uppercase;line-height:1.1;text-align:center">${esc(brand?.name || 'YOUR BUSINESS')}</div>`;
      if (v === 'logo') return flexCol('background:#fff;border:1px solid #ded9cb;border-radius:'+px(.05)+';padding:8%', logo(it.h*.6));
      return flexCol('background:#fff;border:1px solid #ded9cb;border-radius:'+px(.05)+';padding:6% 5%',
        logo(it.h*.3) + bizname +
        `<div style="width:46%;height:${Math.max(1,px(.02))}px;background:${d.border||P};margin:${px(.02)} 0"></div>` + line +
        (brand?.tagline ? `<div style="font:600 ${px(it.h*.06)}px ${FONT_UI};color:#8a877e;letter-spacing:.14em;text-transform:uppercase">${esc(brand.tagline)}</div>` : ''));
    }
    case 'staff': {
      const st = d.style || 'ember';
      const styles = {
        ember:  { bg:P,           fg:'#fff',      bd:P },
        dark:   { bg:'#1b1b1e',   fg:'#ffb020',   bd:'#1b1b1e' },
        green:  { bg:'#2f7d4f',   fg:'#fff',      bd:'#2f7d4f' },
        yellow: { bg:'#ffb020',   fg:'#191405',   bd:'#ffb020' },
        outline:{ bg:'#1b1b1e',   fg:'#fff',      bd:'#ffb020' },
      };
      const c = styles[st] || styles.ember;
      return `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:${px(.02)};width:100%;height:100%;background:${c.bg};color:${c.fg};border:${bw}px solid ${c.bd};border-radius:${px(.07)};overflow:hidden">
        <div style="font:800 ${px(it.h*.34)}px ${FONT_UI};letter-spacing:.09em;line-height:1;white-space:nowrap">${esc(d.word || 'STAFF')}</div>
        ${name ? `<div style="font:600 ${px(it.h*.13)}px ${FONT_UI};opacity:.85;letter-spacing:.08em;text-transform:uppercase;line-height:1;white-space:nowrap">${esc(name)}</div>` : ''}
        ${brand?.name ? `<div style="font:600 ${px(it.h*.075)}px ${FONT_UI};opacity:.6;letter-spacing:.16em;text-transform:uppercase;line-height:1;white-space:nowrap">${esc(brand.name)}</div>` : ''}
      </div>`;
    }
    case 'text': {
      return `<div style="display:flex;width:100%;height:100%;align-items:center;justify-content:${d.align==='left'?'flex-start':d.align==='right'?'flex-end':'center'};overflow:hidden">
        <div style="font:${d.weight||800} ${px(d.fs || it.h*.72)}px ${FONT_UI};color:${d.ink||'#1b1b1e'};line-height:1.05;white-space:pre-wrap;max-width:98%">${esc(d.text || 'YOUR TEXT')}</div></div>`;
    }
    case 'shape': {
      const k = d.kind || 'rect';
      if (k === 'circle') return `<div style="width:100%;height:100%;border-radius:50%;background:${d.fill||P};border:${bw*.6}px solid rgba(0,0,0,.12)}"></div>`;
      if (k === 'line') return `<div style="display:flex;align-items:center;width:100%;height:100%"><div style="width:100%;height:${Math.max(1.5,px(.045))}px;background:${d.fill||P}"></div></div>`;
      if (k === 'star'){
        const pts = starPts(.5, .5, .48, .2);
        return `<svg viewBox="0 0 1 1" style="width:100%;height:100%"><polygon points="${pts}" fill="${d.fill||'#ffb020'}"/></svg>`;
      }
      return `<div style="width:100%;height:100%;background:${d.fill||P};border-radius:${px(d.rad||.06)};border:${bw*.5}px solid rgba(0,0,0,.1)"></div>`;
    }
    case 'logo': {
      return `<div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;overflow:hidden">
        ${brand?.logo ? `<img src="${brand.logo}" alt="" style="width:92%;height:92%;object-fit:contain">` : `<div style="font:700 ${px(it.h*.16)}px ${FONT_UI};color:#b9b3a4">NO LOGO SAVED</div>`}</div>`;
    }
    case 'image': {
      return `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff">
        ${d.src ? `<img src="${d.src}" alt="" style="width:100%;height:100%;object-fit:${d.fit||'contain'}">` : `<div style="font:700 ${px(it.h*.14)}px ${FONT_UI};color:#b9b3a4">ARTWORK</div>`}</div>`;
    }
    default:
      return flexCol('background:#fff;border:1px dashed #b9b3a4', `<div style="font:700 ${px(it.h*.2)}px ${FONT_UI};color:#b9b3a4">${TYPE_NAMES[it.type]||it.type}</div>`);
  }
}

function starPts(cx, cy, r1, r2){
  let pts = [];
  for (let i = 0; i < 10; i++){
    const a = -Math.PI/2 + i * Math.PI/5;
    const r = i % 2 === 0 ? r1 : r2;
    pts.push((cx + r*Math.cos(a)).toFixed(3) + ',' + (cy + r*Math.sin(a)).toFixed(3));
  }
  return pts.join(' ');
}
function initialsOf(name){
  const w = String(name||'').trim().split(/\s+/).filter(Boolean);
  if (!w.length) return '';
  return (w[0][0] + (w[1]?.[0] || '')).toUpperCase();
}

/* positioned item wrapper (used by editor + previews) */
function itemWrapHTML(it, ppi, brand, opts={}){
  const sel = opts.sel ? ' sel' : '', oob = opts.oob ? ' oob' : '';
  const handles = opts.handles ? `<div class="si-r" data-role="rotate"></div><div class="si-h" data-role="resize"></div>` : '';
  return `<div class="sheet-item${sel}${oob}" data-id="${it.id}" style="left:${it.x*ppi}px;top:${it.y*ppi}px;width:${it.w*ppi}px;height:${it.h*ppi}px;transform:rotate(${it.rot||0}deg)">
    <div class="si-c">${itemContent(it, ppi, brand)}</div>${handles}</div>`;
}

/* full sheet visualization (scale via ppi) */
function renderSheetHTML(items, ppi, opts={}){
  const S = SHEET_IN * ppi, M = MARGIN_IN * ppi;
  const inArea = i => opts.all ? true : true; // items are always placed relative to design area
  const itemHTML = items.map(it => itemWrapHTML(it, ppi, opts.brand, { sel: opts.selIds?.has(it.id), oob: opts.showOob && itemOOB(it) })).join('');
  const grid = opts.grid ? `<div class="sh-grid0" style="background-image:linear-gradient(to right,rgba(0,0,0,.05) 1px,transparent 1px),linear-gradient(to bottom,rgba(0,0,0,.05) 1px,transparent 1px),linear-gradient(to right,rgba(0,0,0,.09) 1px,transparent 1px),linear-gradient(to bottom,rgba(0,0,0,.09) 1px,transparent 1px);background-size:${ppi*.5}px ${ppi*.5}px,${ppi*.5}px ${ppi*.5}px,${ppi}px ${ppi}px,${ppi}px ${ppi}px"></div>` : '';
  const mark = ppi >= 22 ? `<div class="sh-mark" style="bottom:${M/2.6}px;font-size:${Math.max(5,ppi*.13)}px">EVIL TRANSFERS · 13 × 13 IN TRANSFER SHEET · DEMO</div>` : '';

/* ---------------- geometry ---------------- */
function aabb(it){
  const rot = (it.rot || 0) % 360;
  if (Math.abs(rot) < .01 || Math.abs(rot-180) < .01 || Math.abs(rot-360) < .01) return { x:it.x, y:it.y, w:it.w, h:it.h };
  const r = rot * Math.PI / 180;
  const cos = Math.abs(Math.cos(r)), sin = Math.abs(Math.sin(r));
  const w = it.w*cos + it.h*sin, h = it.w*sin + it.h*cos;
  return { x: it.x + it.w/2 - w/2, y: it.y + it.h/2 - h/2, w, h };
}
function rectsHit(a, b, tol=0){
  return a.x < b.x + b.w - tol && a.x + a.w > b.x + tol && a.y < b.y + b.h - tol && a.y + a.h > b.y + tol;
}
function itemOOB(it){ const b = aabb(it); return b.x < -.005 || b.y < -.005 || b.x + b.w > AREA_IN + .005 || b.y + b.h > AREA_IN + .005; }
function overlapPairs(items){
  const out = [];
  for (let i = 0; i < items.length; i++) for (let j = i+1; j < items.length; j++){
    const a = aabb(items[i]), b = aabb(items[j]);
    if (rectsHit(a, b, .015)) out.push([items[i], items[j]]);
  }
  return out;
}
function optimizeLayout(items){
  const g = .125;
  const its = deep(items).sort((a,b) => b.h - a.h || b.w - a.w);
  let x = g, y = g, rh = 0;
  for (const it of its){
    if (x + it.w > AREA_IN - g){ x = g; y += rh + g; rh = 0; }
    it.x = Math.round(x * 8) / 8; it.y = Math.round(y * 8) / 8;
    x += it.w + g; rh = Math.max(rh, it.h);
  }
  return its;
}
function findFreeSpot(items, w, h){
  const step = .125;
  for (let y = 0; y <= AREA_IN - h + .001; y += step){
    for (let x = 0; x <= AREA_IN - w + .001; x += step){
      const r = { x, y, w, h };
      if (!items.some(o => rectsHit(r, aabb(o), .05))) return { x: Math.round(x*8)/8, y: Math.round(y*8)/8 };
    }
  }
  return { x: .5, y: .5 };
}
function mkItem(src, over={}){
  const tpl = typeof src === 'string' ? TPL_BY_ID[src] : null;
  const type = tpl ? tpl.type : src;
  const d = deep(tpl ? tpl.d : {});
  if (tpl?.variant) d.variant = tpl.variant;
  if (tpl?.shape) d.shape = tpl.shape;
  if (tpl?.big) d.big = true;
  if (tpl?.word) d.word = tpl.word;
  Object.assign(d, over.data || {});
  const it = { id: uid(), type, x: 0, y: 0, w: tpl ? tpl.w : 2, h: tpl ? tpl.h : 1, rot: 0, data: d };
  if (over.x != null){ it.x = over.x; it.y = over.y; }
  if (type === 'text'){ it.w = 3; it.h = .6; d.text = d.text || 'YOUR TEXT'; d.fs = d.fs || .42; }
  if (type === 'shape'){ it.w = 1.5; it.h = 1.5; }
  if (type === 'badge' && d.shape === 'circle'){ const s = Math.min(it.w, it.h); it.w = s; it.h = s; }
  if (type === 'logo'){ it.w = 2; it.h = 2; }
  if (type === 'image'){ it.w = 2.5; it.h = 2.5; }
  return it;
}
function sheetContents(items){
  const c = {};
  items.forEach(it => c[it.type] = (c[it.type]||0) + 1);
  return Object.entries(c).map(([t,n]) => `${n} × ${TYPE_NAMES[t]||t}`);
}
function sheetUnitPrice(items){ return 17.5 + .9 * items.length; }

function processUpload(file, cb, maxPx=340){
  if (!file || !/^image\//.test(file.type)){ toast('Upload failed', 'Please choose an image file (PNG, JPG, SVG).', 'err'); return; }
  const rd = new FileReader();
  rd.onload = () => {
    if (/svg/i.test(file.type)){ cb({ src: rd.result, w: 300, h: 300, name: file.name }); return; }
    const img = new Image();
    img.onload = () => {
      const sc = Math.min(1, maxPx / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * sc));
      c.height = Math.max(1, Math.round(img.height * sc));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      cb({ src: c.toDataURL('image/png'), w: c.width, h: c.height, name: file.name });
    };
    img.onerror = () => toast('Upload failed', 'That image could not be read.', 'err');
    img.src = rd.result;
  };
  rd.readAsDataURL(file);
}

function MOUNT_branding(){
  const f = $('[data-form="branding"]'); if (!f) return;
  const sync = (src, dst) => $(`[name="${src}"]`, f).addEventListener('input', e => { $(`[name="${dst}"]`, f).value = e.target.value; });
  sync('cp','primary'); sync('primary','cp'); sync('cs','secondary'); sync('secondary','cs');
  $('#logo-file').addEventListener('change', e => {
    processUpload(e.target.files[0], art => {
      currentBiz().logo = art.src;
      currentBiz().uploadedLogo = true;
      save(); toast('Logo uploaded', 'Your logo was saved to your brand profile.', 'ok');
      render();
    }, 260);
  });
}

/* ---------------- template library ---------------- */
function tplPreviewHTML(tpl, brand){
  const it = mkItem(tpl.id, { data: sampleDataFor(tpl, brand) });
  const ppi = Math.min(34, 150 / it.w, 104 / it.h);
  return `<div class="tpl-prev-sheet" style="transform-origin:center">${itemWrapHTML(it, ppi, brand)}</div>`;
}
function sampleDataFor(tpl, brand){
  const d = { useLogo: true };
  if (tpl.type === 'badge'){ d.name = 'ALEX RIVERA'; d.sub = 'TEAM MEMBER'; }
  if (tpl.type === 'apron'){ d.name = 'ALEX RIVERA'; d.sub = 'KITCHEN'; }
  if (tpl.type === 'chest' && tpl.variant === 'name'){ d.name = 'ALEX RIVERA'; d.sub = 'SERVER'; }
  if (tpl.type === 'hat' && tpl.variant === 'name'){ d.name = 'ALEX'; d.sub = ''; }
  if (tpl.type === 'hat' && tpl.variant === 'initials'){ d.initials = initialsOf(brand?.name || 'AB'); }
  if (tpl.type === 'staff'){ d.name = 'ALEX RIVERA'; }
  return d;
}

    <div class="tpl-grid">${mine.map(t => {

        <div class="tpl-prev"><span class="pdot">SAVED</span>${itemWrapHTML(it, ppi, b)}</div>
        <div class="tpl-meta"><b>${esc(t.name)}</b><span class="tcat">${esc(t.cat)}</span>

  for (const cat of CAT_ORDER){

<script>
/* ============================================================
   DESIGN EDITOR — WYSIWYG 13" x 13" TRANSFER SHEET
   ============================================================ */
const NAT_W = 22 + SHEET_IN * PPI, NAT_H = 60 + SHEET_IN * PPI;
const ED = {
  active:false, items:[], sel:new Set(),
  snap:true, grid:true, zoom:1, base:.85,
  label:'Custom Transfer Sheet', cartSheetId:null,
  undoStack:[], redoStack:[],
};
function ED_reset(){ ED.active=false; ED.items=[]; ED.sel=new Set(); ED.undoStack=['[]']; ED.redoStack=[]; ED.label='Custom Transfer Sheet'; ED.cartSheetId=null; ED.zoom=1; }
function ED_newSession(opts={}){
  ED_reset();
  ED.active = true;
  ED.items = opts.items ? deep(opts.items) : [];
  ED.label = opts.label || 'Custom Transfer Sheet';
  ED.cartSheetId = opts.cartSheetId || null;
  ED.undoStack = [JSON.stringify(ED.items)];
  go('editor');
}
function ED_scale(){ return (ED.base || .85) * ED.zoom; }
function ED_brand(){ return currentBiz() || DB.businesses.joes; }
function ED_applyScale(){
  const f = $('#ed-frame'), s = ED_scale();
  if (!f) return;
  f.style.transform = `scale(${s})`;
  const sz = $('#ed-sizer');
  sz.style.width = (NAT_W * s + 56) + 'px';
  sz.style.height = (NAT_H * s + 56) + 'px';
  const z = $('#zoom-lab'); if (z) z.textContent = Math.round(s * 100) + '%';
}
function ED_fit(){
  const vp = $('#ed-vp'); if (!vp) return;
  ED.base = Math.min((vp.clientWidth - 40) / NAT_W, (vp.clientHeight - 40) / NAT_H, 1);
  ED_applyScale();
}

function ED_paint(){
  const holder = $('#sh-holder'); if (!holder) return;
  const brand = ED_brand();
  const guides = `<div class="guide" id="guide-v"></div><div class="guide" id="guide-h"></div>`;
  holder.innerHTML = renderSheetHTML(ED.items, PPI, {
    brand, grid: ED.grid, showOob: true, selIds: ED.sel, handles: true, guides,
  });
  ED_layers(); ED_status();
}
function ED_layers(){
  const box = $('#layers-box'); if (!box) return;
  if (!ED.items.length){ box.innerHTML = `<div class="small dim" style="padding:6px 2px">Nothing on the sheet yet.</div>`; return; }
  box.innerHTML = ED.items.map(it => `
    <div class="lay ${ED.sel.has(it.id) ? 'on' : ''}" data-act="ed-layer" data-id="${it.id}">
      ${ic(it.type==='image' ? 'image' : it.type==='text' ? 'type' : it.type==='shape' ? 'shapes' : it.type==='hat' ? 'star' : it.type==='bag' ? 'bag' : it.type==='staff' ? 'users' : 'user', 13)}
      <span class="lay-n">${esc(layerName(it))}</span>
      <span class="lay-x" data-act="ed-del-item" data-id="${it.id}" data-stop="1">${ic('x',12)}</span>
    </div>`).join('');
}
function layerName(it){
  const d = it.data || {};
  if (it.type === 'text') return d.text || 'Text';
  if (it.type === 'image') return 'Artwork';
  if (it.type === 'logo') return 'My logo';
  if (it.type === 'shape') return (d.kind || 'shape') + ' shape';
  return d.name || TYPE_NAMES[it.type] || it.type;
}
function ED_status(){
  const bar = $('#ed-status'); if (!bar) return;
  const oob = ED.items.filter(itemOOB).length;
  const ov = overlapPairs(ED.items).length;
  bar.innerHTML = `
    <span class="st-chip"><i style="background:var(--ember)"></i>SHEET 13 × 13 IN</span>
    <span class="st-chip"><i style="background:var(--hot)"></i>DESIGN AREA 12.5 × 12.5 IN</span>
    <span class="st-chip"><i style="background:var(--dim)"></i>MARGIN 0.25 IN PER SIDE</span>
    <span>${ED.items.length} ITEM${ED.items.length === 1 ? '' : 'S'}</span>
    ${oob ? `<span class="warnbox">${ic('warn',12)} ${oob} item${oob>1?'s':''} outside design area</span>` : ''}
    ${ov ? `<span class="warnbox">${ic('warn',12)} ${ov} overlapping pair${ov>1?'s':''}</span>` : ''}
    ${!oob && !ov && ED.items.length ? `<span class="okbox">${ic('check',12)} In bounds</span>` : ''}
    <div class="spacer"></div>
    <span class="st-chip ${ED.snap?'':''}" style="cursor:pointer" data-act="ed-snap"><i style="background:${ED.snap?'var(--grn)':'var(--dim)'}"></i>SNAP ${ED.snap?'ON':'OFF'}</span>
    <span class="st-chip" style="cursor:pointer" data-act="ed-grid"><i style="background:${ED.grid?'var(--grn)':'var(--dim)'}"></i>GRID ${ED.grid?'ON':'OFF'}</span>`;
  // toolbar enable/disable
  const has = ED.sel.size > 0;
  ['ed-dup','ed-rotl','ed-rotr','ed-del','ed-edit'].forEach(a => { const el = $(`[data-act="${a}"]`); if (el) el.classList.toggle('off', !has); });
  const al = $('#align-btn'); if (al) al.classList.toggle('off', ED.sel.size < 2);
  const un = $('[data-act="ed-undo"]'), re = $('[data-act="ed-redo"]');
  if (un) un.classList.toggle('off', ED.undoStack.length < 2);
  if (re) re.classList.toggle('off', !ED.redoStack.length);
  const hint = $('#ed-hint'); if (hint) hint.style.display = ED.items.length ? 'none' : 'flex';
}
function ED_commit(){
  const s = JSON.stringify(ED.items);
  if (s !== ED.undoStack[ED.undoStack.length - 1]){
    ED.undoStack.push(s);
    if (ED.undoStack.length > 60) ED.undoStack.shift();
    ED.redoStack = [];
  }
  ED_paint();
}
function ED_undo(){
  if (ED.undoStack.length < 2) return;
  ED.redoStack.push(ED.undoStack.pop());
  ED.items = JSON.parse(ED.undoStack[ED.undoStack.length - 1]);
  ED.sel = new Set(ED.items.filter(i => ED.sel.has(i.id)).map(i => i.id));
  ED_paint();
}
function ED_redo(){
  const s = ED.redoStack.pop(); if (!s) return;
  ED.undoStack.push(s);
  ED.items = JSON.parse(s);
  ED_selPrune(); ED_paint();
}
function ED_selPrune(){ ED.sel = new Set([...ED.sel].filter(id => ED.items.some(i => i.id === id))); }
function ED_addItem(it){
  const spot = findFreeSpot(ED.items, it.w, it.h);
  it.x = spot.x; it.y = spot.y;
  ED.items.push(it);
  ED.sel = new Set([it.id]);
  ED_commit();
}
function ED_dupSel(){
  const clones = [];
  [...ED.sel].forEach(id => {
    const it = ED.items.find(i => i.id === id); if (!it) return;
    const c = deep(it); c.id = uid(); c.x = Math.min(it.x + .25, AREA_IN - c.w); c.y = Math.min(it.y + .25, AREA_IN - c.h);
    clones.push(c);
  });
  if (!clones.length) return;
  ED.items.push(...clones);
  ED.sel = new Set(clones.map(c => c.id));
  ED_commit();
  toast('Duplicated', clones.length + ' item' + (clones.length>1?'s':'') + ' copied and nudged ¼".', 'ok', 1800);
}
function ED_delSel(){
  if (!ED.sel.size) return;
  const n = ED.sel.size;
  ED.items = ED.items.filter(i => !ED.sel.has(i.id));
  ED.sel = new Set();
  ED_commit();
  toast('Deleted', n + ' item' + (n>1?'s':'') + ' removed from the sheet.', 'info', 1800);
}
function ED_rotate(dir){
  ED.items.forEach(it => { if (ED.sel.has(it.id)) it.rot = (((it.rot || 0) + dir * 90) % 360 + 360) % 360; });
  ED_commit();
}
function ED_align(mode){
  const sel = ED.items.filter(i => ED.sel.has(i.id));
  if (sel.length < 2) return;
  const xs = sel.map(i => i.x), xe = sel.map(i => i.x + i.w), ys = sel.map(i => i.y), ye = sel.map(i => i.y + i.h);
  if (mode === 'left') sel.forEach(i => i.x = Math.min(...xs));
  if (mode === 'hcenter') { const c = (Math.min(...xs) + Math.max(...xe)) / 2; sel.forEach(i => i.x = c - i.w/2); }
  if (mode === 'right') { const m = Math.max(...xe); sel.forEach(i => i.x = m - i.w); }
  if (mode === 'top') sel.forEach(i => i.y = Math.min(...ys));
  if (mode === 'vcenter') { const c = (Math.min(...ys) + Math.max(...ye)) / 2; sel.forEach(i => i.y = c - i.h/2); }
  if (mode === 'bottom') { const m = Math.max(...ye); sel.forEach(i => i.y = m - i.h); }
  if (mode === 'disth' && sel.length > 2){
    const s = [...sel].sort((a,b) => a.x - b.x);
    const total = Math.max(...xe) - Math.min(...xs), used = s.reduce((t,i) => t + i.w, 0);
    const gap = (total - used) / (s.length - 1);
    let x = Math.min(...xs);
    s.forEach(i => { i.x = x; x += i.w + gap; });
  }
  if (mode === 'distv' && sel.length > 2){
    const s = [...sel].sort((a,b) => a.y - b.y);
    const total = Math.max(...ye) - Math.min(...ys), used = s.reduce((t,i) => t + i.h, 0);
    const gap = (total - used) / (s.length - 1);
    let y = Math.min(...ys);
    s.forEach(i => { i.y = y; y += i.h + gap; });
  }
  ED_commit();
}
function ED_optimize(){
  if (!ED.items.length) return;
  ED.items = optimizeLayout(ED.items);
  ED_commit();
  const over = ED.items.some(itemOOB);
  toast(over ? 'Optimized — sheet is full' : 'Layout optimized',
    over ? 'Not everything fits on one 13″ × 13″ sheet — remove some items or split into two sheets.'
         : 'All items arranged efficiently inside the 12.5″ × 12.5″ design area.',
    over ? 'warn' : 'ok');
}

function MOUNT_editor(){
  if (!ED.active) ED_newSession({});   // direct URL / refresh case
  ED_paint();
  ED_fit();
  const vp = $('#ed-vp');
  const nameInput = $('#sheet-name');
  nameInput.addEventListener('change', () => { ED.label = nameInput.value.trim() || 'Custom Transfer Sheet'; });

  const onResize = () => ED_fit();
  window.addEventListener('resize', onResize);
  APP.cleanups.push(() => window.removeEventListener('resize', onResize));

  vp.addEventListener('wheel', e => {
    if (!e.ctrlKey) return;
    e.preventDefault();
    ED.zoom = clamp(ED.zoom * (e.deltaY < 0 ? 1.12 : .9), .3, 3);
    ED_applyScale();
  }, { passive:false });

  /* ---- pointer interactions: move / resize / rotate / select ---- */
  const onPD = e => {
    if (e.button !== 0) return;
    const handle = e.target.closest('[data-role]');
    const itemEl = e.target.closest('.sheet-item');
    const role = handle?.dataset.role;
    if (!itemEl){
      if (!e.shiftKey && ED.sel.size){ ED.sel.clear(); ED_paint(); }
      return;
    }
    e.preventDefault();
    const id = itemEl.dataset.id;
    if (!ED.items.find(i => i.id === id)) return;
    if (e.shiftKey && !role){
      ED.sel.has(id) ? ED.sel.delete(id) : ED.sel.add(id);
      ED_paint(); return;
    }
    if (!ED.sel.has(id)){ ED.sel.clear(); ED.sel.add(id); ED_paint(); }
    const scale = ED_scale();
    const start = { x: e.clientX, y: e.clientY };
    const starts = [...ED.sel].map(sid => {
      const o = ED.items.find(i => i.id === sid);
      return { it: o, x: o.x, y: o.y, w: o.w, h: o.h, rot: o.rot || 0 };
    });
    const rect0 = $(`.sheet-item[data-id="${id}"]`)?.getBoundingClientRect();
    const ang0 = rect0 ? Math.atan2(e.clientY - (rect0.top + rect0.height/2), e.clientX - (rect0.left + rect0.width/2)) * 180/Math.PI + 90 : 0;
    let moved = false;

    const showGuide = (k, pos) => { const g = $(`#guide-${k}`); if (g){ g.style.display = 'block'; if (k === 'v') g.style.left = pos + 'px'; else g.style.top = pos + 'px'; } };
    const hideGuides = () => { const a = $('#guide-v'), b = $('#guide-h'); if (a) a.style.display = 'none'; if (b) b.style.display = 'none'; };

    const onMove = ev => {
      const dx = (ev.clientX - start.x) / scale, dy = (ev.clientY - start.y) / scale;
      if (!moved && Math.abs(ev.clientX - start.x) + Math.abs(ev.clientY - start.y) < 3) return;
      moved = true;
      if (role === 'resize'){
        const s = starts[0];
        let w = Math.max(.3, s.w + dx), h = Math.max(.3, s.h + dy);
        if (!ev.altKey){ const ar = s.w / s.h; if (w / h > ar) h = w / ar; else w = h * ar; }
        if (ED.snap){ w = Math.round(w * 8) / 8; h = Math.round(h * 8) / 8; }
        s.it.w = w; s.it.h = h;
      } else if (role === 'rotate'){
        const s = starts[0];
        const rect = $(`.sheet-item[data-id="${id}"]`)?.getBoundingClientRect();
        if (rect){
          const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
          const ang = Math.atan2(ev.clientY - cy, ev.clientX - cx) * 180/Math.PI + 90;
          let r = (s.rot + (ang - ang0)) % 360; if (r < 0) r += 360;
          const near = [0, 90, 180, 270, 360].find(v => Math.abs(r - v) < 4);
          if (near != null) r = near % 360;
          s.it.rot = Math.round(r * 2) / 2;
        }
      } else {
        for (const s of starts){
          let nx = s.x + dx, ny = s.y + dy;
          if (ED.snap){ nx = Math.round(nx * 8) / 8; ny = Math.round(ny * 8) / 8; }
          const cX = nx + s.it.w / 2, cY = ny + s.it.h / 2;
          let guided = false;
          if (Math.abs(cX - AREA_IN/2) < .09){ nx = AREA_IN/2 - s.it.w/2; showGuide('v', AREA_IN/2 * PPI); guided = true; }
          if (Math.abs(cY - AREA_IN/2) < .09){ ny = AREA_IN/2 - s.it.h/2; showGuide('h', AREA_IN/2 * PPI); guided = true; }
          if (!guided) hideGuides();
          s.it.x = clamp(nx, -1.5, AREA_IN + 1);
          s.it.y = clamp(ny, -1.5, AREA_IN + 1);
        }
      }
      for (const s of starts){
        const el = $(`.sheet-item[data-id="${s.it.id}"]`);
        if (el){
          el.style.left = s.it.x * PPI + 'px'; el.style.top = s.it.y * PPI + 'px';
          el.style.width = s.it.w * PPI + 'px'; el.style.height = s.it.h * PPI + 'px';
          el.style.transform = `rotate(${s.it.rot || 0}deg)`;
          el.classList.toggle('oob', itemOOB(s.it));
        }
      }
      ED_status();
    };
    const onUp = () => {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      hideGuides();
      if (moved) ED_commit();
    };
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  };
  vp.addEventListener('pointerdown', onPD);
  APP.cleanups.push(() => vp.removeEventListener('pointerdown', onPD));

  vp.addEventListener('dblclick', e => {
    const itemEl = e.target.closest('.sheet-item');
    if (!itemEl) return;
    const it = ED.items.find(i => i.id === itemEl.dataset.id);
    if (it) openItemModal(it);
  });

  const onKey = e => {
    const tag = document.activeElement?.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    const k = e.key;
    if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === 'z'){ e.preventDefault(); e.shiftKey ? ED_redo() : ED_undo(); return; }
    if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === 'y'){ e.preventDefault(); ED_redo(); return; }
    if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === 'd'){ e.preventDefault(); ED_dupSel(); return; }
    if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === 'a'){ e.preventDefault(); ED.sel = new Set(ED.items.map(i => i.id)); ED_paint(); return; }
    if (k === 'Escape'){ ED.sel.clear(); ED_paint(); return; }
    if ((k === 'Delete' || k === 'Backspace') && ED.sel.size){ e.preventDefault(); ED_delSel(); return; }
    if (k.startsWith('Arrow') && ED.sel.size){
      e.preventDefault();
      const step = e.shiftKey ? .25 : .05;
      ED.items.forEach(it => { if (!ED.sel.has(it.id)) return;
        if (k === 'ArrowLeft') it.x -= step; if (k === 'ArrowRight') it.x += step;
        if (k === 'ArrowUp') it.y -= step; if (k === 'ArrowDown') it.y += step;
      });
      ED_commit();
    }
  };
  document.addEventListener('keydown', onKey);
  APP.cleanups.push(() => document.removeEventListener('keydown', onKey));
  ED_applyScale();
}
</script>
<script>
/* ============================================================

function hasName(it){ return ['badge','apron','chest','hat','staff','bag'].includes(it.type); }

function openItemModal(it){
  const d = it.data || {};
  const colorField = (label, name, val) => `
    <div class="field"><label class="lbl">${label}</label>
      <div class="color-row"><input type="color" name="c_${name}" value="${val}">
        <input class="inp" name="${name}" value="${esc(val)}"></div></div>`;
  let fields = '';
  if (hasName(it)) fields += `
    <div class="field"><label class="lbl">${it.type === 'staff' ? 'Name (optional)' : 'Name / main text'}</label>
      <input class="inp" name="m_name" value="${esc(d.name||'')}" placeholder="e.g. Sarah Martinez" maxlength="30"></div>`;
  if (['badge','apron','chest','hat'].includes(it.type)) fields += `
    <div class="field"><label class="lbl">Second line (position / dept)</label>
      <input class="inp" name="m_sub" value="${esc(d.sub||'')}" placeholder="e.g. Server · Kitchen" maxlength="30"></div>`;
  if (it.type === 'staff') fields += `
    <div class="field"><label class="lbl">Badge word</label>
      <input class="inp" name="m_word" value="${esc(d.word||'STAFF')}" maxlength="14"></div>
    <div class="field"><label class="lbl">Style</label><select class="sel" name="m_style">
      ${['ember','dark','green','yellow','outline'].map(s => `<option value="${s}" ${d.style===s?'selected':''}>${s}</option>`).join('')}
    </select></div>`;
  if (it.type === 'bag') fields += `
    <div class="field"><label class="lbl">Promotional line (optional)</label>
      <input class="inp" name="m_line" value="${esc(d.line||'')}" placeholder="FRESH · LOCAL · EVERY DAY" maxlength="40"></div>`;
  if (it.type === 'text') fields += `
    <div class="field"><label class="lbl">Text</label>
      <textarea class="inp" name="m_text" rows="2" maxlength="60">${esc(d.text||'')}</textarea></div>
    <div class="row3">
      <div class="field"><label class="lbl">Size (in)</label>
        <input class="inp" name="m_fs" type="number" step="0.05" min="0.05" max="3" value="${d.fs || .42}"></div>
      <div class="field"><label class="lbl">Weight</label>
        <select class="sel" name="m_weight">${[400,600,700,800].map(w => `<option value="${w}" ${(d.weight||800)==w?'selected':''}>${w}</option>`).join('')}</select></div>
      <div class="field"><label class="lbl">Align</label>
        <select class="sel" name="m_align">${['left','center','right'].map(a => `<option value="${a}" ${(d.align||'center')===a?'selected':''}>${a}</option>`).join('')}</select></div>
    </div>`;
  if (it.type === 'shape') fields += `
    <div class="row2">
      <div class="field"><label class="lbl">Shape</label>
        <select class="sel" name="m_kind">${['rect','circle','star','line'].map(k => `<option value="${k}" ${(d.kind||'rect')===k?'selected':''}>${k}</option>`).join('')}</select></div>
      ${colorField('Fill color', 'm_fill', d.fill || ED_brand().colors.primary)}
    </div>`;
  if (it.type === 'image') fields += `
    <div class="field"><label class="lbl">Fit</label>
      <select class="sel" name="m_fit"><option value="contain" ${(d.fit||'contain')==='contain'?'selected':''}>contain</option><option value="cover" ${d.fit==='cover'?'selected':''}>cover</option></select></div>`;
  if (it.type === 'badge') fields += `
    <div class="field"><label class="lbl">Badge shape</label>
      <select class="sel" name="m_shape">${['rounded','square','circle','classic','modern','industrial'].map(s => `<option value="${s}" ${(d.shape||'rounded')===s?'selected':''}>${s}</option>`).join('')}</select></div>`;
  if (['badge','apron','chest','hat','bag','back'].includes(it.type)) fields += `
    <label class="check"><input type="checkbox" name="m_uselogo" ${d.useLogo !== false ? 'checked' : ''}>
      <span><span class="cl">Use my business logo</span><span class="cd">From your saved branding</span></span></label>`;
  if (['badge','apron','staff','hat','back','bag'].includes(it.type)) fields += colorField('Accent / border color', 'm_border', d.border || ED_brand().colors.primary);

  openModal(`
    <div class="m-head"><h3>${ic('edit',15)} Edit item — ${esc(TYPE_NAMES[it.type] || it.type)}</h3>
      <button class="m-x" data-act="modal-close">${ic('x',15)}</button></div>
    <form data-form="item-edit" data-id="${it.id}" novalidate>
      <div class="m-body">
        <div style="display:flex;justify-content:center;background:#efece5;border-radius:10px;padding:18px;margin-bottom:16px">
          <div id="item-edit-prev" style="position:relative">${itemWrapHTML(it, 26, ED_brand())}</div>
        </div>
        ${fields}
        <div class="row3">
          <div class="field"><label class="lbl">Width (in)</label>
            <input class="inp" name="m_w" type="number" step="0.1" min="0.3" max="12.5" value="${it.w}"></div>
          <div class="field"><label class="lbl">Height (in)</label>
            <input class="inp" name="m_h" type="number" step="0.1" min="0.3" max="12.5" value="${it.h}"></div>
          <div class="field"><label class="lbl">Rotation °</label>
            <input class="inp" name="m_rot" type="number" step="15" min="0" max="359" value="${it.rot || 0}"></div>
        </div>
      </div>
      <div class="m-foot">
        <button type="button" class="btn dgr left" data-act="item-del" data-id="${it.id}">${ic('trash',13)} Delete</button>
        <button type="button" class="btn" data-act="item-dup" data-id="${it.id}">${ic('copy',13)} Duplicate</button>
        <button type="button" class="btn" data-act="item-save-template" data-id="${it.id}">${ic('layers',13)} Save as template</button>
        <button class="btn pri" data-test="item-save">Save changes</button>
      </div>
    </form>`, { static:true });
  // live preview refresh on input

    const probe = deep(it);
    applyItemForm(probe, new FormData(form));

}
function applyItemForm(it, fd){
  const d = it.data = it.data || {};
  const g = (k, alt) => (fd.get(k) ?? alt);
  if (hasName(it)) d.name = String(g('m_name', d.name)).trim();
  if (['badge','apron','chest','hat'].includes(it.type)) d.sub = String(g('m_sub', d.sub)).trim();
  if (it.type === 'staff'){ d.word = String(g('m_word', d.word) || 'STAFF').toUpperCase(); d.style = g('m_style', d.style); }
  if (it.type === 'bag') d.line = String(g('m_line', d.line)).trim();
  if (it.type === 'text'){
    d.text = String(g('m_text', d.text));
    d.fs = clamp(parseFloat(g('m_fs', d.fs)) || .42, .05, 3);
    d.weight = parseInt(g('m_weight', d.weight)) || 800;
    d.align = g('m_align', d.align);
  }
  if (it.type === 'shape'){ d.kind = g('m_kind', d.kind); d.fill = String(g('m_fill', d.fill)); }
  if (it.type === 'image') d.fit = g('m_fit', d.fit);
  if (it.type === 'badge'){
    d.shape = g('m_shape', d.shape);
    if (d.shape === 'circle'){ const s = Math.min(it.w, it.h); it.w = s; it.h = s; }
  }
  if (fd.has('m_uselogo')) d.useLogo = fd.get('m_uselogo') === 'on';
  else if (['badge','apron','chest','hat','bag','back'].includes(it.type)) d.useLogo = false;
  if (fd.has('m_border')) d.border = String(g('m_border', d.border));
  const w = clamp(parseFloat(g('m_w', it.w)) || it.w, .3, 12.5);
  const h = clamp(parseFloat(g('m_h', it.h)) || it.h, .3, 12.5);
  it.w = w; it.h = h;
  it.rot = ((parseFloat(g('m_rot', it.rot)) || 0) % 360 + 360) % 360;
}

/* ---------------- preflight ---------------- */
function runPreflight(){
  const items = ED.items;
  const oob = items.filter(itemOOB);
  const pairs = overlapPairs(items);
  const missing = items.filter(it => {
    const d = it.data || {};
    if (['badge','apron','staff'].includes(it.type)) return !d.name && !(it.type === 'staff' && d.word);
    if (it.type === 'chest' && it.variant === 'name') return !d.name;
    if (it.type === 'text') return !(d.text || '').trim();
    return false;
  });
  const lowres = items.filter(it => it.type === 'image' && it.data?.natW && (it.data.natW / it.w < 150 || it.data.natH / it.h < 150));
  const dimsOk = items.every(it => it.w > .2 && it.h > .2);
  const checks = [
    { key:'bounds',  label:'All artwork inside printable area', ok: !oob.length,   items: oob,
      detail: oob.length ? `${oob.length} item${oob.length>1?'s':''} cross into the ¼&quot; margin or beyond the sheet.` : 'Every item sits inside the 12.5&Prime; &times; 12.5&Prime; design area.',
      fix: oob.length ? 'fix-oob' : null },
    { key:'overlap', label:'No overlapping objects', ok: !pairs.length,            items: pairs.flat(),
      detail: pairs.length ? `${pairs.length} overlapping pair${pairs.length>1?'s':''} — transfers would fuse together when printed.` : 'No items overlap each other.',
      fix: pairs.length ? 'fix-overlap' : null },
    { key:'text',    label:'Required text completed', ok: !missing.length,        items: missing,
      detail: missing.length ? 'Some items still show the “ADD NAME” placeholder.' : 'All names and text fields are filled in.',
      fix: missing.length ? 'fix-missing' : null },
    { key:'res',     label:'Resolution acceptable', ok: !lowres.length, warn: true, items: lowres,
      detail: lowres.length ? 'Some uploaded artwork is below 150 DPI at its printed size. It will still print, but may look soft.' : 'Uploaded artwork is 150 DPI or better at print size.',
      fix: null },
    { key:'dims',    label:'Template dimensions valid', ok: dimsOk,
      detail: dimsOk ? 'All items have valid physical dimensions.' : 'An item has an invalid size — edit it and set width/height.' },
    { key:'sheet',   label:'Sheet size: 13&quot; &times; 13&quot;', ok: true, info: true,
      detail: 'This is the physical sheet you will receive — the final product is always 13&quot; &times; 13&quot;.' },
    { key:'area',    label:'Design area: 12.5&quot; &times; 12.5&quot;', ok: true, info: true,
      detail: 'The ¼&quot; perimeter on every side is the non-print margin — it keeps the press clean.' },
  ];
  return { checks, blocked: !!(oob.length || pairs.length || missing.length || !dimsOk), items, oob, pairs, missing };
}

function openPreflightModal(){
  const pf = runPreflight();
  const rows = pf.checks.map(c => {
    const icon = c.ok ? 'check' : (c.warn ? 'warn' : 'x');
    const cls = c.ok ? 'ok' : (c.warn ? 'warn' : 'bad');
    const stat = c.ok ? (c.info ? 'INFO' : 'PASS') : (c.warn ? 'CHECK' : 'FIX');
    return `<div class="pf-row ${cls}">
      ${ic(icon, 16)}
      <div style="flex:1"><b>${c.label} <span class="small dim mono" style="float:right">${stat}</span></b>
        <div class="pf-d">${c.detail}</div>
        ${c.fix ? `<div class="pf-fix">
          ${c.fix === 'fix-oob' ? `<button class="btn sm" data-act="pf-fix" data-fix="oob">${ic('zap',11)} Move all inside design area</button>` : ''}
          ${c.fix === 'fix-overlap' ? `<button class="btn sm" data-act="pf-fix" data-fix="overlap">${ic('zap',11)} Auto-arrange (optimize layout)</button>` : ''}
          ${c.fix === 'fix-missing' ? `<button class="btn sm" data-act="pf-fix" data-fix="missing">${ic('edit',11)} Edit first missing item</button>` : ''}
        </div>` : ''}
      </div></div>`;
  }).join('');
  const price = sheetUnitPrice(ED.items);
  openModal(`
    <div class="m-head"><h3>${ic('clipboard',15)} Preflight check</h3>
      <button class="m-x" data-act="modal-close">${ic('x',15)}</button></div>
    <div class="m-body">
      <div class="pf-sum">
        <span class="chip">${ED.items.length} ITEMS</span>
        <span class="chip">SHEET 13 × 13 IN</span>
        <span class="chip">AREA 12.5 × 12.5 IN</span>
        <span class="tag demo">DEMO PRICE ${money(price)} / SHEET</span>
      </div>
      ${rows}
      ${pf.blocked
        ? `<div class="blocked-banner">${ic('alert',16)} NOT READY — FIX THE ITEMS ABOVE</div>`
        : `<div class="ready-banner">${ic('check',16)} READY TO PRINT</div>`}
      <div class="small dim" style="margin-top:6px;line-height:1.5">What you see is what you get: your items print exactly where they sit on the
      12.5&Prime; design area of a physical 13&Prime; &times; 13&Prime; transfer sheet. Apply them to your own shirts, aprons, hats and bags.</div>
    </div>
    <div class="m-foot">
      <button class="btn left" data-act="modal-close">Back to editor</button>
      <button class="btn pri" data-act="pf-add-cart" ${pf.blocked ? 'disabled' : ''} data-test="pf-add-cart">
        ${ic('cart',13)} ADD TO CART — ${money(price)}</button>
    </div>`);
}

function fixPreflight(kind){
  if (kind === 'oob'){
    ED.items.forEach(it => {
      const b = aabb(it);
      let dx = 0, dy = 0;
      if (b.x < 0) dx = -b.x; if (b.y < 0) dy = -b.y;
      if (b.x + b.w > AREA_IN) dx = AREA_IN - (b.x + b.w);
      if (b.y + b.h > AREA_IN) dy = AREA_IN - (b.y + b.h);
      it.x = Math.round((it.x + dx) * 8) / 8; it.y = Math.round((it.y + dy) * 8) / 8;
    });
    ED_commit();
  }
  if (kind === 'overlap') ED_optimize();
  if (kind === 'missing'){
    const it = ED.items.find(i => {
      const d = i.data || {};
      if (['badge','apron','staff'].includes(i.type)) return !d.name && !(i.type === 'staff' && d.word);
      if (i.type === 'text') return !(d.text || '').trim();
      return false;
    });
    if (it){ openItemModal(it); return; }
  }
  openPreflightModal();
}

function openAddToCartModal(){
  const unit = sheetUnitPrice(ED.items);

function validateCheckout(f){
  let ok = true;
  const need = {
    cname: v => v.trim().length > 1, cemail: v => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v),
    sname: v => v.trim().length > 1, sstreet: v => v.trim().length > 3,
    scity: v => v.trim().length > 1, sstate: v => v.trim().length > 1, szip: v => /^\d{5}(-\d{4})?$/.test(v.trim()),
    pname: v => v.trim().length > 1, pnum: v => v.replace(/\D/g,'').length >= 15,
    pexp: v => /^\d{2}\/\d{2}$/.test(v), pcvv: v => /^\d{3,4}$/.test(v),
  };
  for (const [name, test] of Object.entries(need)){
    const inp = f.querySelector(`[name="${name}"]`);
    if (!inp) continue;
    const good = test(inp.value || '');
    inp.classList.toggle('bad', !good);
    const err = inp.parentElement.querySelector('.err-msg');
    if (err) err.classList.toggle('show', !good);
    if (!good) ok = false;
  }
  if (!ok) toast('Check the highlighted fields', 'A few entries need attention before the demo payment can run.', 'warn');
  return ok;
}

function orderTimelineHTML(o){
  const steps = [
    ['paid','Payment received'], ['queued','Entered queue'], ['printing','Printing'],
    ['printed','Quality check'], ['qc_pass','Passed QC'], ['shipped','Shipped'],
  ];
  const has = k => o.timeline.some(t => t.k === k);
  const issue = [...o.timeline].reverse().find(t => t.k === 'issue');
  const mapIdx = { queued:1, printing:2, qc_required:3, ready_to_ship:4, shipped:5, attention:2, reprint:2 };
  const idx = o.status === 'cancelled' ? -1 : (mapIdx[o.status] ?? 0);
  const issueActive = issue && !['shipped'].includes(o.status);
  const html = steps.map(([k, label], i) => {
    let cls = '';
    const done = has(k) && (i < idx || o.status === 'shipped');
    if (o.status === 'cancelled') cls = '';
    else if (issueActive && i === 2) cls = 'warn';
    else if (i < idx || (o.status === 'shipped' && has(k))) cls = 'done';
    else if (i === idx) cls = has(k) || o.status !== 'queued' ? 'now' : 'now';
    const icon = cls === 'warn' ? ic('warn',13) : cls === 'done' ? ic('check',13) : cls === 'now' ? ic('clock',13) : `<span style="font:700 11px var(--mono);color:var(--dim)">${i+1}</span>`;
    return `<div class="tl-step ${cls}"><div class="tnode">${icon}</div><span class="tlab">${label}</span></div>`;
  }).join('');
  let note = '';
  if (o.status === 'cancelled') note = 'Order was cancelled by the operator.';
  else if (issueActive) note = (issue?.note || 'Production issue') + (o.status === 'reprint' ? ' — awaiting reprint.' : o.status === 'attention' ? ' — operator attention required.' : ' — reprinting now.');
  else if (issue && o.status === 'shipped') note = 'Recovered after a production issue and shipped.';
  else if (o.status === 'queued' && o.timeline.find(t => t.k === 'queued')?.note) note = o.timeline.find(t => t.k === 'queued').note;
  return `<div class="tl">${html}</div>${note ? `<div style="text-align:center">${issueActive ? `<span class="tl-note">${ic('warn',11)} ${esc(note)}</span>` : `<span class="small dim" style="font-style:italic">${esc(note)}</span>`}</div>` : ''}`;
}

  const sheet = { id: uid(), label:'Sample Order — ' + biz.name.split(' ')[0], items, brand,
    contents: sheetContents(items), qty: 1, unit: sheetUnitPrice(items) };
  const order = createOrder(bizId, [sheet], { ...biz.addr, name: biz.contact }, { name: biz.contact, email: biz.email });
  return order;
}
